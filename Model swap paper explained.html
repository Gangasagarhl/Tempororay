_config.yaml to configs/rl_llb_config.local.yaml and set keys and models there."], ["Run", "python run/run_llb.py"], ["Models", "Reach all models through an OpenAI-compatible route. An embedding endpoint is required; keep the embedding model fixed across old and new model."]]}, "risks": {"caption": "Wipe Tip A from 0.90 to 0.50 the right way (MemRL reads the caches first)", "rows": [{"item": "Edit the memory file only", "what_can_go_wrong": "Wrong: the code reads local_cache/q_cache.json first and still finds 0.90, so your edit is ignored.", "when": "Whenever an arm is built by file edit alone.", "what_it_costs": "The arm silently runs as Keep, and the comparison is false.", "how_to_notice": "The score the code uses still reads 0.90.", "restaurant": "Changing the printed menu while the kitchen still reads the board."}, {"item": "Edit the file, delete q_cache.json", "what_can_go_wrong": "Wrong: with q_cache gone, the code falls back to mem_cache.json, which still says 0.90, so your edit is ignored.", "when": "If only one cache file is deleted.", "what_it_costs": "Same as above: a false arm.", "how_to_notice": "The score the code uses still reads 0.90.", "restaurant": "Wiping the board while the waiter's notebook still says \"9 of 10\"."}, {"item": "Edit the file, delete the whole local_cache folder", "what_can_go_wrong": "Right: with both caches gone, the code reads the memory file and finds 0.50. Nothing goes wrong if this is done every time.", "when": "Each time an arm is built.", "what_it_costs": "Nothing beyond rebuilding the caches.", "how_to_notice": "The score the code uses reads 0.50.", "restaurant": "Clearing the board and the notebook so everyone reads the new menu."}, {"item": "Keep the embedding model fixed across old and new model", "what_can_go_wrong": "A changed embedding model changes which items are found, not only their scores.", "when": "If the embedding model differs between runs.", "what_it_costs": "The effect of the swap cannot be separated from the embedding change.", "how_to_notice": "Check the embedding model name in every run's settings.", "restaurant": "Changing the menu's order of dishes at the same time as the chef."}]}}, {"title": "Add the frozen score files: RoMeRL (step 7)", "plain": "Clone github.com/YOUNG-fnxm/RoMeRL and check its two checkpoints (saved score files) against the hashes in manifest.json. Build arms by editing q_cache.json.gz. It is a nearly free extra test on scores another group trained. The release is read-only (no learning code), and it does not say which model produced the scores.", "restaurant": "Another restaurant has published its frozen rating book. The owner can test it cheaply with his new chef, but cannot add new ratings to it, and the book does not say which chef earned the ratings.", "app": "The application has the same gap as this release: it does not record which model a judgement was made with. Here the paper must confirm the model from the paper's text.", "table": null, "risks": {"caption": "Rules for the RoMeRL score files", "rows": [{"item": "Check the two checkpoints against the hashes in manifest.json", "what_can_go_wrong": "A changed or damaged file is used.", "when": "On download.", "what_it_costs": "Results on the wrong scores.", "how_to_notice": "A hash does not match.", "restaurant": "The rating book received is not the one published."}, {"item": "For a wipe, set values to the starting value; do not delete keys", "what_can_go_wrong": "Deleting keys removes items instead of resetting their scores.", "when": "When the wipe arm is built.", "what_it_costs": "The wipe arm changes the content, not only the scores.", "how_to_notice": "The number of entries falls after the edit.", "restaurant": "Tearing dishes out of the book instead of blanking their ratings."}, {"item": "Confirm from the paper which model produced the scores before calling it the \"old model\"", "what_can_go_wrong": "The repository does not say, so the old model may be named wrongly.", "when": "When the results are written up.", "what_it_costs": "A wrong swap pair in the paper.", "how_to_notice": "No source for the model name in the notes.", "restaurant": "Calling the ratings Chef Ravi's without knowing who cooked."}, {"item": "Use the same embedding model that built the files (text-embedding-3-large), and label edited files as derived", "what_can_go_wrong": "A different embedding model breaks the files, or edited files are mistaken for the originals.", "when": "When the files are loaded or released.", "what_it_costs": "Wrong results or confusion about provenance (where the files came from).", "how_to_notice": "Check the embedding name and the file labels.", "restaurant": "Reading the book with a different index, or passing off an edited copy as the original."}]}}, {"title": "Record licences before you release anything (step 8)", "plain": "Write down the licence of every piece you use. The ICML contribution type asks authors to address licensing and provenance. Release your own scripts, prompts, score files and outcome tables, and point to the original data sources, until the upstream terms for DDXPlus and BIRD are confirmed.", "restaurant": "Before printing a recipe book, the owner notes who owns each borrowed recipe and whether he may copy it. Where the owner of a recipe has said nothing, he prints only his own notes and tells readers where to find the original.", "app": "Not applicable: the release contains only public benchmark material and the paper's own files; nothing from the application is released.", "table": {"caption": "Licences as recorded in the original", "columns": ["What", "Licence"], "rows": [["StreamBench code", "Apache-2.0 (an open licence that allows reuse)"], ["MemRL", "MIT (an open licence that allows reuse)"], ["RoMeRL", "MIT"], ["StreamBench data on Hugging Face", "No licence declared"], ["LifelongAgentBench", "No licence declared"]]}, "risks": {"caption": "The release rule", "rows": [{"item": "Release your own scripts, prompts, score files and outcome tables, and point to the original data sources", "what_can_go_wrong": "Data with no declared licence is copied into the release.", "when": "Before the upstream terms for DDXPlus and BIRD are confirmed.", "what_it_costs": "A licensing problem the ICML contribution type asks authors to address.", "how_to_notice": "The release folder contains benchmark data files rather than links to them.", "restaurant": "Printing another restaurant's recipe without knowing whether it may be copied."}]}}]}, {"chapter": "The experiment", "summary": "This section is the design of the study: the terms it uses, the six models and twelve switches, the probe table, the seven ways of handling old scores, what is measured, the controls and statistics, and three predictions written down in advance. None of it has been run yet; it says exactly what will be run and how a result will be judged.", "steps": [{"title": "Seven words the plan uses", "plain": "The section opens with seven terms that the rest of the plan relies on. A memory item is a stored tip with a score saying how often showing it helped. An ordered swap pair is an old model and the new model that replaces it, and the direction counts. The other five terms are in the table.", "restaurant": "The memory item is a dish on the menu and its score is the customers' rating. Ravi handing over to Suresh is one ordered pair; Suresh handing back to Ravi is a different pair, because a rating can carry over well one way and badly the other way.", "app": "The memory item is a stored solution on the procedural graph, for example \"replay these 6 commands with this gap\" for the Write that never completed in sample S17, row 155. Its score is the admin's \"judged correct 9 of 10\". An ordered pair would be, for example, Claude Sonnet today to DeepSeek on the laptop.", "table": {"caption": "The seven terms, as the original defines them", "columns": ["Term", "What it means", "In the restaurant"], "rows": [["Memory item and score", "A stored tip, example or past solution, with a number that says how often showing it helped. MemRL (a published memory system) keeps one number per item, called a Q-value. ACE (another published system) keeps two counters per item, helpful and harmful.", "A dish and its rating. One restaurant shows \"good 90% of the time\"; another shows two tallies, thumbs up and thumbs down."], ["Ordered swap pair", "An old model and the new model that replaces it. Haiku 4.5 to Haiku 5.5 and Haiku 5.5 to Haiku 4.5 are two different pairs, because earlier work found the effect can reverse with direction.", "Ravi to Suresh is not the same as Suresh to Ravi."], ["Probe table", "For each test case, the new model is run once with each candidate item shown on its own, and every answer is graded by a program. The table then holds the true outcome of every choice, so any rule can be scored by looking up the item it would pick.", "Suresh cooks the order once per recipe card, a fixed taster marks each plate, and the marks go in a book."], ["Noise floor", "How much the results move when nothing has changed: a model swapped onto itself, or identical runs repeated. A drop counts only if it is larger than this.", "How much Ravi's own ratings wobble from one evening to the next."], ["Equivalence test", "A test that shows two results are within a set margin, here 3 points. It turns \"no drop\" into a claim you can defend, instead of a failure to find a difference.", "Proving Suresh's plates are within 3 points of Ravi's, not just \"we could not taste a difference\"."], ["Power prior (the calibrated discount)", "A standard statistical way to combine old and new evidence: old evidence counts with a weight between 0 and 1. The calibrated rule chooses that weight from a few fresh checks. It is a known method, so the paper does not claim it as new.", "The Calibrated choice: 16 test plates decide how far the old rating is trusted (trust 0.10 turns 0.90 into 0.54)."], ["Bootstrap interval", "An error bar made by re-sampling the test cases many times. It shows how far a number could move by chance.", "Re-drawing the customers many times to see how much the rating could move by luck."]]}, "risks": null}, {"title": "Six models, twelve switches", "plain": "The study uses six models in three old-to-new pairs, one pair from each of three makers. One pair has open weights, meaning anyone can download and run it, so others can repeat the study after the closed models retire. Counting each direction separately gives twelve ordered swaps: three upgrades, three downgrades as a control, and six cross-maker swaps.", "restaurant": "Picture twelve restaurants that changed chef. In three the old chef was followed by his own better-trained successor, in three the change ran backwards as a check, and in six the new chef came from a different cooking school altogether.", "app": "Your tool faces the same kinds of change: today Claude Sonnet writes the proposals, on the laptop it may be DeepSeek (a different maker), and next year a newer model from the same maker.", "table": {"caption": "The planned pairs (model names come from earlier notes and were not re-checked on vendor pages)", "columns": ["Maker", "Old model", "New model"], "rows": [["Anthropic", "Claude Haiku 4.5", "Claude Haiku 5.5"], ["OpenAI", "GPT-5.6-luna", "GPT-6-luna"], ["Qwen (open weights)", "Qwen3.5-27B", "Qwen3.8-27B"]]}, "risks": {"caption": "Risks of this choice of models", "rows": [{"item": "Using closed models from two makers", "what_can_go_wrong": "A closed model can be retired before all its calls are done, and then its runs can never be repeated.", "when": "When a vendor retires the old model during the experiment weeks.", "what_it_costs": "Missing cells in the main table, or a whole pair dropped from the paper.", "how_to_notice": "The vendor's retirement page, checked on day one, or calls that suddenly fail.", "restaurant": "Ravi leaves town before he has cooked the test plates, so his side of the comparison is lost."}, {"item": "Counting each direction as its own pair", "what_can_go_wrong": "Twelve pairs instead of six means more calls and more cost.", "when": "Every time a pair is run both ways.", "what_it_costs": "More of the roughly USD 700 budget (USD is United States dollars).", "how_to_notice": "The cost log per call.", "restaurant": "Checking both Ravi-to-Suresh and Suresh-to-Ravi doubles the test plates."}, {"item": "Downgrades as a control", "what_can_go_wrong": "If downgrades and upgrades look the same, the effect may come from any change at all, not from a better model.", "when": "When the results of the three downgrades are compared with the three upgrades.", "what_it_costs": "The explanation in the paper gets weaker.", "how_to_notice": "The per-pair table shows upgrades and downgrades side by side.", "restaurant": "If ratings break just as badly when Suresh hands back to Ravi, the problem is the change itself, not Suresh's skill."}, {"item": "Model names taken from earlier notes", "what_can_go_wrong": "A name may be wrong or point to a different version than expected.", "when": "On the first day, if names are not confirmed on the vendor's own page.", "what_it_costs": "Wrong labels in the paper, which a reviewer can catch.", "how_to_notice": "The exact model ID the API (application programming interface, the vendor's call interface) reports for every call.", "restaurant": "The menu says \"Chef Suresh\" but a stand-in cooked that night."}]}}, {"title": "The probe table", "plain": "For every probe task, take its top four candidate memory items. Run the new model twice with exactly that one item shown, and once with no item, and let a program grade every answer. Because the table holds the outcome of every candidate, the choice any rule would make can be scored by looking it up, with no further model calls.", "restaurant": "For each test order, Suresh cooks the dish following just one of the four best recipe cards at a time, twice per card, and once with no card at all. A fixed taster marks every plate good or bad. Later, to judge any rating rule, you simply look up how the plate it would have picked actually tasted; no more cooking is needed.", "app": "In your tool this would mean replaying each of the top stored solutions for one defect on its own with the new model and recording whether it worked. No such table exists in the tool today; the admin's four buttons judge only the proposal that was shown.", "table": {"caption": "What is run for each probe task", "columns": ["What the new model is shown", "How many runs", "Who grades"], "rows": [["Candidate item 1 alone", "Twice", "A program"], ["Candidate item 2 alone", "Twice", "A program"], ["Candidate item 3 alone", "Twice", "A program"], ["Candidate item 4 alone", "Twice", "A program"], ["No item", "Once", "A program"]]}, "risks": {"caption": "Risks of the probe-table design", "rows": [{"item": "One item shown at a time", "what_can_go_wrong": "Real helpers often show several items together, and the result may differ from one item alone.", "when": "When readers apply the findings to systems that show many items at once.", "what_it_costs": "A limit the paper must state on its first page.", "how_to_notice": "Reviewers ask about it; the plan already lists it as a limit to state plainly.", "restaurant": "Testing each recipe card alone says little about a cook who reads three cards at once."}, {"item": "Only the top four candidates are probed", "what_can_go_wrong": "A better item ranked fifth or lower is never tested, so no rule can be credited for finding it.", "when": "When the best item sits outside the top four for a task.", "what_it_costs": "The ceiling looks lower than it really is.", "how_to_notice": "Many probe tasks where all four candidates fail.", "restaurant": "The best dish was never cooked because it was fifth on the list."}, {"item": "Grading by a program", "what_can_go_wrong": "Only tasks with a checkable answer can be used, so the paper says nothing about open-ended work.", "when": "Always, by design: the plan uses single-call tasks graded by program.", "what_it_costs": "A narrower claim; the limits must say so.", "how_to_notice": "The limits section of the paper.", "restaurant": "A taster who only says right or wrong cannot judge a dish that has no single right taste."}]}}, {"title": "The seven arms", "plain": "An arm is one way of running the helper on the day of the switch. Seven are compared: no memory, the new model's own memory, and five arms that all use the old model's memory content but treat its scores differently. Because the content is identical in those five, any difference between them comes from the scores alone. Earlier papers could not separate \"the content transfers\" from \"the scores transfer\".", "restaurant": "No memory is Suresh cooking with no ratings. Own is Suresh earning his own ratings from scratch on the same customers. Keep, Wipe, Fixed discount and Calibrated are the four choices from the story. Re-scored is Suresh cooking every dish again until each has fresh ratings: the best possible, and the most expensive.", "app": "Today your tool does Keep: \"judged correct 9 of 10\" stays as it is when the model changes, and the tool does not record which model the judgements were made with. Wipe would set every stored solution back to its starting value; Re-scored would mean the admin judging every solution again under the new model.", "table": {"caption": "The seven arms, as in the original", "columns": ["Arm", "Memory content", "Scores"], "rows": [["No memory", "None", "None"], ["Own", "The new model's own bank, built on the same stream", "The new model's own"], ["Keep", "The old model's bank", "Unchanged"], ["Wipe", "The old model's bank", "Reset to the starting value, so ranking is by similarity alone"], ["Fixed discount", "The old model's bank", "Weighted by 0.5, with a sweep from 0.1 to 0.9"], ["Calibrated discount", "The old model's bank", "Weight chosen from 8, 16, 32 or 64 fresh checks"], ["Re-scored (ceiling)", "The old model's bank", "Earned again by the new model"]]}, "risks": {"caption": "What each arm risks on the day of the switch", "rows": [{"item": "No memory", "what_can_go_wrong": "All learned help is lost, so success may fall to the model's bare level.", "when": "Whenever memory actually helps on the task.", "what_it_costs": "The lowest success of all arms; it is the floor the others are measured against.", "how_to_notice": "Its task success sits below the memory arms.", "restaurant": "Suresh cooks with no menu ratings at all."}, {"item": "Own", "what_can_go_wrong": "Building a new bank takes as many episodes as the old one did.", "when": "Every time a new model arrives.", "what_it_costs": "The full cost of building memory again.", "how_to_notice": "The cost table: calls and dollars for the build.", "restaurant": "Suresh earns every rating from scratch over many evenings."}, {"item": "Keep", "what_can_go_wrong": "Old scores may push a weak item to the top if the new model uses items differently.", "when": "When the old and new model succeed and fail on different cases.", "what_it_costs": "Lower success with no warning, because the scores still look confident.", "how_to_notice": "Retained validity after the switch falls well below its home value.", "restaurant": "The biryani still shows 9 of 10, but Suresh's version disappoints."}, {"item": "Wipe", "what_can_go_wrong": "Everything learned is thrown away, and ranking falls back on similarity alone.", "when": "When the old scores were in fact still right.", "what_it_costs": "Lost value until scores are earned again.", "how_to_notice": "Wipe does worse than Keep on the final test tasks.", "restaurant": "A dish that would still please gets no stars and is skipped."}, {"item": "Fixed discount", "what_can_go_wrong": "The same weight at every switch may be too much trust for one switch and too little for another.", "when": "When switches differ in how far scores survive.", "what_it_costs": "Some value lost, or some wrong trust kept.", "how_to_notice": "The sweep from 0.1 to 0.9 shows the best weight changing from pair to pair.", "restaurant": "Every dish at half believability, whoever the new chef is."}, {"item": "Calibrated discount", "what_can_go_wrong": "With few fresh checks the chosen weight can be off by chance.", "when": "At the smallest budget, 8 fresh checks.", "what_it_costs": "A weaker rule, plus the cost of the checks themselves.", "how_to_notice": "Comparing it with the re-scored ceiling at 8, 16, 32 and 64 checks.", "restaurant": "Suresh's first few test plates happen to be lucky or unlucky."}, {"item": "Re-scored (ceiling)", "what_can_go_wrong": "It is the most expensive arm, because every item needs fresh runs.", "when": "Always; it is there as the best case, not as a cheap rule.", "what_it_costs": "The highest cost in calls and dollars.", "how_to_notice": "The cost table per arm.", "restaurant": "Suresh re-cooks every dish on the menu before any rating is shown."}]}}, {"title": "What is measured", "plain": "The headline is retained validity: among pairs of candidate items whose outcomes differ, how often did the one with the higher carried score do better? 0.5 is a coin toss. It is measured at home (old scores, old model) and after the swap (old scores, new model), and the ratio is reported. Four more measures follow: first-shown success, task success on the final test tasks, recovery, and cost per arm.", "restaurant": "Take pairs of dishes where one pleased the customer and the other did not. If the dish with the higher old rating usually wins, the ratings still mean something. The page's example has 75% under Ravi and 60% under Suresh, so the part above a coin toss is (60 - 50) / (75 - 50) = 0.40; these are example values, because the experiment has not been run.", "app": "For your tool it would ask: of two stored solutions for the same defect where one fixed it and one did not, does the one with the better \"judged correct\" tally win under the new model? Recovery would be how many new admin judgements are needed before the tallies can be trusted again.", "table": {"caption": "The five measures", "columns": ["Measure", "What it says"], "rows": [["Retained validity (the headline)", "Among pairs of candidates whose outcomes differ, how often the one with the higher carried score did better; 0.5 is chance. Measured at home and after the swap; the ratio is reported."], ["First-shown success", "The success rate of the item each arm would show first."], ["Task success", "Success on the final test tasks."], ["Recovery", "The number of fresh episodes needed to reach 95% of the ceiling."], ["Cost per arm", "Calls, tokens and dollars."]]}, "risks": {"caption": "How the measures can mislead", "rows": [{"item": "Retained validity counts only pairs whose outcomes differ", "what_can_go_wrong": "If few candidates differ in outcome, there is little to count and the number is shaky.", "when": "When most candidates all succeed or all fail on a task.", "what_it_costs": "Wide error bars and a weak headline.", "how_to_notice": "The pilot gate asks for at least 30% of probe tasks with candidates whose outcomes differ.", "restaurant": "If every dish pleases every customer, ratings cannot be tested."}, {"item": "Reporting the ratio of after to home", "what_can_go_wrong": "If scores were weak even at home, the ratio means little.", "when": "When home concordance is near chance.", "what_it_costs": "The study has nothing to carry over; the plan then expects a different paper.", "how_to_notice": "The pilot gate asks for home concordance of at least 0.60.", "restaurant": "If Ravi's ratings never predicted anything, it is pointless to ask whether they survive Suresh."}, {"item": "Recovery to 95% of the ceiling", "what_can_go_wrong": "The count of fresh episodes can vary a lot with which tasks come first.", "when": "With a single stream order.", "what_it_costs": "A recovery number that does not repeat.", "how_to_notice": "Three stream orders are planned; compare recovery across them.", "restaurant": "How many evenings Suresh needs depends on which customers walk in first."}]}}, {"title": "Controls and statistics", "plain": "A drop counts only if it is bigger than the noise floor: each model swapped onto itself, repeated identical runs, and two separately built banks of the same model. Every result is reported per ordered pair, never as a pooled average. Comparisons are paired on the same probe tasks, with bootstrap error bars over tasks and stream orders and a correction across the four primary comparisons. \"No drop\" must be shown with an equivalence test within 3 points.", "restaurant": "Before blaming Suresh, check how much ratings move when Ravi simply cooks again the next evening; only a bigger drop counts. Judge each restaurant on its own, because one good change and one bad change can average to \"nothing happened\". And cook enough plates that the difference is not luck.", "app": "Before blaming a new model for different proposals, check how much the same model's proposals vary between two runs on the same defect. Your tool has no program grader, so the paper's statistics do not carry over to it directly.", "table": null, "risks": {"caption": "The rules, and what breaks if one is skipped", "rows": [{"item": "Claim a drop only if it exceeds the self-swap drop", "what_can_go_wrong": "Without the noise floor, ordinary wobble would be reported as a model-swap effect.", "when": "When identical runs already disagree often.", "what_it_costs": "A false finding that reviewers can take apart.", "how_to_notice": "Figure 1 shows the self-swap diagonal next to every pair.", "restaurant": "Blaming Suresh for a dip that Ravi also has on a normal evening."}, {"item": "Report every result per ordered pair; never rely on a pooled average", "what_can_go_wrong": "Opposite effects in two directions can cancel out in an average.", "when": "When one direction helps and the other hurts, as in the Goyal and Ray preprint (+9.91 and -13.28 points).", "what_it_costs": "The real effect is hidden.", "how_to_notice": "The main table has one row per ordered pair.", "restaurant": "One restaurant gains and another loses, and the average says nothing changed."}, {"item": "Paired comparisons, bootstrap intervals, correction across the four primary comparisons", "what_can_go_wrong": "Testing many things at once makes some differences look real by luck.", "when": "When many arms and pairs are compared.", "what_it_costs": "A lucky result presented as a finding.", "how_to_notice": "Error bars on every number and the correction stated in the prediction file.", "restaurant": "Taste enough plates, and do not trust the one lucky evening out of many."}, {"item": "Test \"no drop\" as equivalence within 3 points", "what_can_go_wrong": "A failed difference test is not evidence of no drop; it may just mean too few cases.", "when": "When the swap effect looks small.", "what_it_costs": "A claim of safety that is not supported.", "how_to_notice": "The equivalence test either confirms the 3-point margin or does not.", "restaurant": "\"We could not taste a difference\" is not \"the plates are the same\"."}, {"item": "Expect small effects; measure at item level", "what_can_go_wrong": "Prior cross-model margins are only 0.3 to 5 points, so task success alone may show nothing.", "when": "If the paper relied on task success only.", "what_it_costs": "An effect that is real but invisible.", "how_to_notice": "Item-level retained validity is the headline for this reason.", "restaurant": "Overall takings barely move, but single dishes may have gone wrong."}, {"item": "Repeat a subset of pairs with a second prompt wording", "what_can_go_wrong": "Results may hold for one wording of the prompt only.", "when": "If only one prompt is used.", "what_it_costs": "Reviewers of accepted measurement papers criticised exactly this.", "how_to_notice": "Compare the subset under both wordings.", "restaurant": "The rating holds only if the order is written the same way on the slip."}]}}, {"title": "Three predictions to register", "plain": "Three predictions go into a dated prediction file before the first paid run, and each is reported whether it passes or fails. One: retained validity rises with how often the two models agree on the same task-and-item cells. Two: the gap between Keep and Wipe shrinks as the new model's no-memory success rises. Three: scores the model gives itself (counters) lose more validity than scores earned from a program's reward (values).", "restaurant": "One: if Suresh pleases and disappoints the same customers Ravi did, Ravi's ratings still work. Two: if Suresh is already excellent without any ratings, the choice of rule matters less. Three: ratings Ravi gave his own dishes should survive the change worse than ratings from a fixed taster.", "app": "Your tool's scores are a third kind: the admin's own verdicts from four buttons. The paper has no human verdicts, so prediction three says nothing about them. The original adds that in your tool code, not the model, decides where a case is stored, so the paper predicts your scores stay safe after a change.", "table": {"caption": "The three predictions, how each is tested and why it matters", "columns": ["Prediction", "How it is tested", "Why it matters"], "rows": [["1. Agreement: if the two models succeed and fail on the same cases, old scores should still work.", "For each of the 12 switches, measure how often the two models get the same result on the same case and item, then check whether that predicts retained validity.", "A team could run a small agreement check before a switch and know in advance whether to keep its scores."], ["2. Stronger new model: if the new model is already good without memory, the choice of rule matters less.", "Compare the gap between Keep and Wipe with the new model's success rate when no memory is shown.", "It tells teams when the decision is worth any effort."], ["3. Who gave the score: scores the model gave itself should survive a switch worse than scores earned from a program's grade.", "Compare retained validity for ACE-style counters with MemRL-style values on the same switches.", "It gives a practical rule with a reason: trust graded scores more than self-assigned ones."]]}, "risks": {"caption": "What happens if a prediction fails", "rows": [{"item": "Prediction 1 (agreement)", "what_can_go_wrong": "Agreement may not predict retained validity.", "when": "When the 12 switches are analysed after the freeze.", "what_it_costs": "No cheap pre-switch check to offer teams; it is still reported.", "how_to_notice": "The analysis across the 12 switches shows no link.", "restaurant": "Suresh pleases the same customers as Ravi, yet the ratings still mislead."}, {"item": "Prediction 2 (stronger new model)", "what_can_go_wrong": "The Keep-Wipe gap may not shrink with a stronger new model.", "when": "When the gap is compared with no-memory success.", "what_it_costs": "Less guidance on when the decision is worth effort.", "how_to_notice": "The gap does not fall as no-memory success rises.", "restaurant": "Even an excellent Suresh is misled by old ratings."}, {"item": "Prediction 3 (who gave the score)", "what_can_go_wrong": "Self-assigned and graded scores may survive equally.", "when": "When counters and values are compared on the same switches.", "what_it_costs": "The practical rule \"trust graded scores more\" is lost.", "how_to_notice": "Retained validity is the same for both score types.", "restaurant": "The chef's own stars and the taster's marks break just as often."}, {"item": "Not registering the predictions in advance", "what_can_go_wrong": "Results could be read to fit whatever came out.", "when": "If the prediction file is not dated before the first paid run.", "what_it_costs": "Reviewers trust the results less.", "how_to_notice": "No dated file exists before the first paid call.", "restaurant": "Writing the guess after tasting the dish."}]}}]}, {"chapter": "What to collect", "summary": "This section lists the nine kinds of record to save from the first day, because several models retire soon and runs cannot be repeated later. It also shows one model call logged field by field, and why each field is kept.", "steps": [{"title": "Start on day one", "plain": "Collecting starts on day one. Several of the models retire soon, so a run that was not saved cannot be repeated later. The release package that goes out with the paper is built from these same files.", "restaurant": "Once Ravi has left, you cannot ask him to cook the biryani again to check a rating. So from the first plate, write down who cooked it, when, what the customer said and what it cost.", "app": "Today your tool does not record which model each admin judgement was made with. Once Claude Sonnet is replaced, nobody can tell which \"judged correct\" counts were earned with it.", "table": null, "risks": {"caption": "The risk of starting late", "rows": [{"item": "Collect from the first call", "what_can_go_wrong": "Calls made before logging starts are lost for good once the model retires.", "when": "If logging is added after the pilot or the first build.", "what_it_costs": "Runs that must be paid for again, or cannot be repeated at all.", "how_to_notice": "Gaps in call IDs, or results with no raw answer behind them.", "restaurant": "Ravi's first week of plates was never written down, and Ravi is gone."}]}}, {"title": "The nine things to collect", "plain": "The original lists nine kinds of record, each with a reason. Together they let anyone re-score the study after the models are gone, rebuild every split and order, build the cost table, and show that the predictions came before the results. ICML (the International Conference on Machine Learning) 2027 also requires an AI disclosure statement, so every place an AI tool helped is listed.", "restaurant": "Keep every order slip and every customer's exact words, which chef cooked and when, how the customers were seated, what each plate cost, the ratings before and after the chef change, the taster's book, the dated note of what you expected, where each ingredient came from, and who helped write the menu.", "app": "The original says the study has to build things your tool's own audit lists as missing: a model field on stored items, a token and cost log, and a check that the tool has not silently fallen back to a stand-in model.", "table": {"caption": "What to collect and why, as in the original", "columns": ["Collect", "Why"], "rows": [["Every prompt and every raw model answer", "Lets anyone re-score the study after the models are gone"], ["Exact model ID, date and time of every call", "A model name can point to different versions over time"], ["Seeds, stream orders and the three-way split files", "Makes the split and order reproducible"], ["Tokens and cost of every call", "Builds the cost table reviewers ask for"], ["Score files of every memory bank, before and after each swap", "They are the object of study"], ["The probe tables", "Every arm and every figure is computed from them"], ["The five pilot numbers and the dated prediction file", "Shows the gate and the predictions came before the results"], ["Hashes and download dates of all datasets, commit IDs of all code", "Provenance, which the ICML type asks for"], ["A list of every place an AI tool helped", "ICML 2027 requires an AI disclosure statement"]]}, "risks": {"caption": "What goes wrong if one of them is missing", "rows": [{"item": "Every prompt and every raw model answer", "what_can_go_wrong": "Nobody can grade the answers again or check a figure.", "when": "After the closed models retire.", "what_it_costs": "The study cannot be re-scored; reviewers may doubt it.", "how_to_notice": "A figure with no raw answers behind it.", "restaurant": "The customer's exact words were not kept, so the rating cannot be checked."}, {"item": "Exact model ID, date and time of every call", "what_can_go_wrong": "Results may mix two versions behind one model name.", "when": "When a vendor updates a model under the same name.", "what_it_costs": "Wrong conclusions about which model did what.", "how_to_notice": "Different model IDs reported by the API under one name.", "restaurant": "The menu says Suresh, but a stand-in cooked that night."}, {"item": "Seeds, stream orders and the three-way split files", "what_can_go_wrong": "A task may end up both earning a score and judging it.", "when": "If the split is cut again later without the saved files.", "what_it_costs": "Results that cannot be reproduced, or that are quietly biased.", "how_to_notice": "Task IDs that appear in two parts.", "restaurant": "The same customer both earned the rating and judged it."}, {"item": "Tokens and cost of every call", "what_can_go_wrong": "No cost table, which reviewers ask for, and no check on the budget.", "when": "From the first paid run.", "what_it_costs": "A missing table in the paper and surprise spending.", "how_to_notice": "The pilot gate compares measured cost with the estimate.", "restaurant": "Nobody knows what the test plates cost."}, {"item": "Score files of every memory bank, before and after each swap", "what_can_go_wrong": "The object of study itself is lost.", "when": "If banks are overwritten when an arm is built.", "what_it_costs": "The arms cannot be rebuilt or checked.", "how_to_notice": "Only one version of a bank on disk.", "restaurant": "The old menu was thrown out when the new one was printed."}, {"item": "The probe tables", "what_can_go_wrong": "No arm and no figure can be computed.", "when": "If probe results are kept only in memory or summaries.", "what_it_costs": "The core of the paper.", "how_to_notice": "Figures that cannot be recomputed from files.", "restaurant": "The taster's book is lost."}, {"item": "The five pilot numbers and the dated prediction file", "what_can_go_wrong": "Nobody can show the gate and the predictions came before the results.", "when": "If the file is written or changed after the runs.", "what_it_costs": "Reviewers trust the results less.", "how_to_notice": "The prediction file's date is later than the first paid call.", "restaurant": "Writing down the guess after tasting the dish."}, {"item": "Hashes and download dates of all datasets, commit IDs of all code", "what_can_go_wrong": "The data or code may have changed, and nobody can prove which version was used.", "when": "When a hosted file or repository is updated.", "what_it_costs": "Weaker provenance, which the ICML contribution type asks for.", "how_to_notice": "A hash that does not match the downloaded file.", "restaurant": "Nobody knows which batch of rice went into the tested biryani."}, {"item": "A list of every place an AI tool helped", "what_can_go_wrong": "The required AI disclosure statement cannot be written accurately.", "when": "At submission.", "what_it_costs": "A rule fault at ICML 2027.", "how_to_notice": "The disclosure statement on the submission checklist.", "restaurant": "Not telling the award jury who helped write the menu."}]}}, {"title": "One call, as it should be logged", "plain": "The original shows one model call written as a single record, with a reason for every field. The values are made up. The record links every number in the paper back to the raw answer it came from. DDXPlus is a medical diagnosis benchmark graded by label match; BIRD is a text-to-SQL benchmark (SQL is the language for querying databases) graded by running the query.", "restaurant": "One plate, one line in the book: which order slip, which chef, at what time, which recipe card was used, what the customer said, whether the taster marked it good, and what it cost.", "app": "In your tool the same line would carry the model that wrote the proposal next to each admin judgement. The original notes the model field and the token and cost log are what the tool's own audit lists as missing.", "table": {"caption": "The fields of one logged call (example values are made up)", "columns": ["Field", "Example value", "Why it is kept"], "rows": [["call_id", "ddx-o2-probe-000417-A-r1", "A unique name for the call. Every number in the paper can be traced back to the raw answer it came from."], ["model_id", "claude-haiku-5-5", "The exact model version the API reports. A model name can point to different versions over time, and closed models retire."], ["called_at", "2026-11-24T10:42:07Z", "When the call ran. It shows which model version was live at the time."], ["stream", "ddxplus", "Which public benchmark the task came from."], ["order_seed", "2", "Which of the three shuffled orders was used, so the order can be rebuilt exactly."], ["part", "probe", "Build, probe or test. It proves no task was used in two parts."], ["arm", "probe-single-item", "Which rule or probe the call belongs to."], ["item_shown", "mem-00183", "Which memory item was in the prompt, or none. The probe table is built from these."], ["prompt_sha256", "9f2c...e41a", "A fingerprint of the exact prompt (SHA-256 is a standard fingerprint method). The full prompt is stored separately, so anyone can check nothing changed."], ["answer", "Pneumonia", "The raw answer, unchanged, so anyone can grade it again later."], ["correct", "true", "The grade from the program: a label match for DDXPlus, the result of running the SQL for BIRD."], ["tokens_in, tokens_out", "2412, 6", "What the call used, for the cost table reviewers ask for."], ["cost_usd", "0.00024", "What the call cost in United States dollars, for the cost table."]]}, "risks": null}]}, {"chapter": "Roadmap", "summary": "This section gives the week-by-week plan from 15 November 2026 to the ICML paper deadline on 22 January 2027, and what must exist at the end of each period. It also sets the go or no-go on 22 November, five pilot conditions that must all hold, and what to do if the gate fails or the schedule slips.", "steps": [{"title": "Eight work periods to submission", "plain": "The plan runs from 15 November 2026 to the l. Set up the MemRL leg.", "The home-validity table and the first three swap pairs."], ["15-21", "All twelve pairs", "All twelve pairs on DDXPlus. Build and probes on BIRD. Every arm scored offline.", "Main table and figure on two benchmarks: the minimum bar."], ["22-30", "Confirmation", "Live check on four pairs, the MemRL leg, the RoMeRL score files and the three predictions.", "Experiments frozen on 15 December."], ["31-46", "Drafting", "Read the ICLR 2027 decisions, choose the route from the result, draft methods and results, build the release package.", "A technical draft."], ["47-53", "The first page", "Abstract, introduction and first figure, with one outside reader.", "The first page, written for the first-stage screen."], ["54-60", "Related work and abstract", "Related work, limits and disclosure statements. Fix the author list.", "Abstract submitted on 14 January."], ["61-68", "Final checks", "Check every reference by hand, finish the appendix, anonymise the repository.", "Paper submitted on 22 January."]]}, "risks": null}, {"title": "The go or no-go on 22 November", "plain": "The full study runs only if all five conditions hold in the pilot. The page's checker also asks that the error bar of the memory gain does not include zero, and that the lower bound of the home concordance is above 0.55. Home concordance is retained validity measured at home: how often the higher-scored item wins with the old model. The example values on the page pass all five; they are examples, to be replaced by the pilot results.", "restaurant": "Before opening, Ravi's ratings must pass five checks: the rated menu must beat cooking without ratings, the ratings must predict good plates, the same dish cooked twice must taste nearly the same, enough dishes must have been tasted often, and the trial must not cost more than twice the plan.", "app": "One check carries over to your tool: before worrying about a model change, check that \"judged correct 9 of 10\" actually picks the better stored solution with the current model. If it does not, there is nothing to carry over.", "table": {"caption": "The page's example pilot values (examples, not results)", "columns": ["Pilot number", "Example value", "Condition"], "rows": [["Memory gain over no memory (points)", "7", "At least 5, with an interval that excludes zero (ticked in the example)"], ["Home concordance (0 to 1)", "0.64", "At least 0.60"], ["Lower bound of that concordance", "0.58", "Above 0.55 (the page's checker)"], ["Repeat disagreement (%)", "11", "Less than 15"], ["Items with five or more visits", "180", "At least 150"], ["Probe tasks with differing outcomes (%)", "35", "At least 30"], ["Measured cost divided by estimated cost", "1.3", "At most 2"]]}, "risks": {"caption": "The five conditions: what a failure means and what to do", "rows": [{"item": "1. The old model with its own memory beats no memory by at least 5 points", "what_can_go_wrong": "Memory does not help enough on this benchmark, so there is no effect to carry over.", "when": "If the pilot gain is under 5 points or its interval includes zero.", "what_it_costs": "The benchmark must be switched before spending more.", "how_to_notice": "The pilot's memory gain on 22 November.", "restaurant": "The rated menu sells no better than an unrated one."}, {"item": "2. Scores mean something at home: concordance of at least 0.60 for at least one score type", "what_can_go_wrong": "The scores do not mean enough even with the old model.", "when": "If greedy retrieval leaves scores uninformative.", "what_it_costs": "Two more days of pilot with more exploration in the build.", "how_to_notice": "Home concordance below 0.60, or its lower bound at or below 0.55.", "restaurant": "Ravi's ratings never predicted which plates pleased."}, {"item": "3. Repeat runs of identical cells disagree less than 15% of the time", "what_can_go_wrong": "Identical runs differ too often, so a swap effect would drown in noise.", "when": "If sampling settings or prompts vary between runs.", "what_it_costs": "Time to find the cause before scaling up.", "how_to_notice": "Repeat disagreement at 15% or more.", "restaurant": "The same dish from the same chef tastes different every evening."}, {"item": "4. At least 150 items with five or more visits, and at least 30% of probe tasks with differing outcomes", "what_can_go_wrong": "Too few items were revisited, or too few probes can tell tips apart.", "when": "If the build is too short or explores too little.", "what_it_costs": "A longer build, or more exploration.", "how_to_notice": "The item visit counts and the share of differing probe tasks.", "restaurant": "Too few dishes were ordered often enough to have a real rating."}, {"item": "5. Measured cost per 1,000 calls is within twice the estimate", "what_can_go_wrong": "The run costs more than twice the estimate.", "when": "If the assumed token counts were too low.", "what_it_costs": "The grid size must be re-planned before going on.", "how_to_notice": "Measured cost divided by estimated cost above 2.", "restaurant": "The trial week used twice the planned ingredients."}]}}, {"title": "If the gate fails", "plain": "If memory does not help on DDXPlus, switch benchmark before spending more. If scores are no better than chance at home, raise exploration in the build and re-run the pilot for two days. If the gate fails twice, the January attempt with this idea is over: write up the finding that scores are weak even before a swap, or move to the runner-up idea on a later timetable.", "restaurant": "If ratings do not help this menu, try another menu before buying more ingredients. If Ravi's ratings never predicted anything, let customers try more varied dishes and taste again for two days. If it fails a second time, skip this year's award and either write about why the ratings were weak, or prepare a different entry later.", "app": "Not applicable: the gate decides the paper's fate, not the tool's.", "table": null, "risks": {"caption": "The fallback decisions", "rows": [{"item": "Switch benchmark if memory does not help on DDXPlus", "what_can_go_wrong": "Spending more on a benchmark where memory shows no gain.", "when": "On 22 November, if condition 1 fails.", "what_it_costs": "Budget and days of the tight schedule.", "how_to_notice": "Condition 1 in the pilot.", "restaurant": "Stop testing ratings on a menu where ratings change nothing."}, {"item": "Raise exploration and re-run the pilot for two days", "what_can_go_wrong": "Two days lost from a schedule that has little slack.", "when": "If home concordance fails.", "what_it_costs": "Two days, and the risk of failing again.", "how_to_notice": "The second pilot's numbers.", "restaurant": "Two more trial evenings with more varied dishes."}, {"item": "Stop the January attempt after two failures", "what_can_go_wrong": "The ICML 2027 attempt with this idea ends.", "when": "If the gate fails a second time.", "what_it_costs": "The January submission; the work turns into a different paper or a later timetable.", "how_to_notice": "Two failed gates.", "restaurant": "No entry for this year's award."}]}}, {"title": "If the schedule slips", "plain": "If the schedule slips by more than three days, cut the MemRL leg down to the RoMeRL score files and keep the two-benchmark grid whole. The two-benchmark grid is what the minimum bar needs; the released-code leg belongs to the higher target bar.", "restaurant": "If the kitchen falls behind, drop the extra guest dish cooked in someone else's kitchen and keep the two main menus complete.", "app": "Not applicable: this is a rule for the paper's schedule.", "table": null, "risks": {"caption": "The slip rule", "rows": [{"item": "Cut the MemRL leg to the RoMeRL score files", "what_can_go_wrong": "The paper loses the full released-code leg, which answers the objection that the effect comes from the authors' own score layer.", "when": "If the schedule slips by more than three days.", "what_it_costs": "Part of the target bar; the minimum bar stays reachable.", "how_to_notice": "Comparing progress with the roadmap dates.", "restaurant": "Serving the guest chef's saved ratings instead of having him cook live."}]}}]}, {"chapter": "How strong the results must be", "summary": "This section sets two bars for the results: a minimum that is enough for the journal TMLR (Transactions on Machine Learning Research) and a higher target that would be competitive at ICML (the International Conference on Machine Learning). No venue publishes such a bar, so both bars are the plan's own judgement, built from its registered margins and the effect sizes in earlier papers.", "steps": [{"title": "Nobody publishes a pass mark", "plain": "No conference or journal says how strong a result must be to be accepted. So the plan makes its own two bars. They are a judgement, built from the margins the plan writes down in advance and from how big the effects were in earlier papers. They are not official rules.", "restaurant": "A famous food award with a jury never says how many points a dish needs to win. A restaurant that wants to enter guesses the bar from past winners and from what it promised to test. The guess is useful, but it is still a guess.", "app": "Not applicable: the bars are about what a paper needs for reviewers, not about how the application works.", "table": null, "risks": {"caption": "Risk of using a home-made bar", "rows": [{"item": "Using the plan's own two bars as the target", "what_can_go_wrong": "The real reviewers may expect more, or something different, than the bars say.", "when": "When the reviews come back, after the paper is submitted on 22 January 2027.", "what_it_costs": "A rejection costs one review round of three to six months before the next venue.", "how_to_notice": "The reviews name gaps that are not in either bar.", "restaurant": "The restaurant meets its own guessed bar, but the jury was looking for something else."}]}}, {"title": "The two bars side by side", "plain": "The minimum bar is what the plan thinks is enough for TMLR, a journal that does not require novelty. The target bar is what the plan thinks is competitive at ICML. Each row below is one part of the results. Where the target says \"The same\", the minimum is already the target.", "restaurant": "The minimum is \"good enough for a respected food guide\": test the rule in 12 restaurants that changed chef and report honestly. The target is \"good enough for the famous award\": also show why some chef changes broke the ratings and that 16 test plates fix it.", "app": "Not applicable: this table is a checklist for the paper. The application has one admin and no 12 model changes to compare.", "table": {"caption": "The two bars, as the original page gives them", "columns": ["Part of the results", "Minimum (enough for TMLR)", "Target (competitive at ICML)"], "rows": [["Coverage", "Two public benchmarks, six models, twelve ordered pairs, all seven arms", "The same, plus the released-code leg and both score types"], ["Scores at home", "Concordance of at least 0.60 for one score type", "For both score types"], ["The swap effect", "Measured per pair with intervals and the noise floor, whatever its size", "A drop beyond the noise floor in a clear subset of pairs, or a tight \"no drop\" within 3 points"], ["Explanation", "The three predictions reported, pass or fail", "At least one prediction holds across the twelve pairs, so the paper says which swaps break and why"], ["The rule", "Keep, wipe and discount compared", "The calibrated discount recovers most of the ceiling from a stated small number of fresh checks"], ["Evidence quality", "Prediction file, paired tests, intervals, cost table, full release", "The same"]]}, "risks": {"caption": "What can go wrong with each row of the bar", "rows": [{"item": "Coverage: two benchmarks, six models, twelve ordered pairs, seven arms", "what_can_go_wrong": "A model retires or the budget runs out before all twelve pairs and seven arms are run.", "when": "Between the go or no-go on 22 November 2026 and the freeze on 15 December 2026.", "what_it_costs": "The paper falls below even the minimum bar, and runs on retired models cannot be repeated.", "how_to_notice": "The roadmap's main table on two benchmarks is not complete by 6 December.", "restaurant": "Some of the 12 restaurants close before the test plates are cooked, so the comparison has holes."}, {"item": "Scores at home: concordance of at least 0.60", "what_can_go_wrong": "The scores do not rank items well even with the model that earned them.", "when": "In the pilot, before the go or no-go on 22 November 2026.", "what_it_costs": "There is nothing to carry over, so this paper cannot be written and a different one replaces it.", "how_to_notice": "The pilot's home concordance is below 0.60 for both score types.", "restaurant": "Even under Chef Ravi, the dishes rated 9 of 10 were not really better than the others, so the ratings meant little from the start."}, {"item": "The swap effect: measured per pair with intervals and the noise floor", "what_can_go_wrong": "A drop is claimed that is no bigger than the change seen when nothing changed at all.", "when": "When results are written up, if the self-swap control is skipped or ignored.", "what_it_costs": "Reviewers judge the result as chance, which hurts soundness, one of the four scored areas.", "how_to_notice": "The drop for a pair is not larger than the self-swap drop for that model.", "restaurant": "Ratings dip a little even when Chef Ravi cooks on two different days; a dip that small after Suresh joins proves nothing."}, {"item": "Explanation: the three predictions", "what_can_go_wrong": "None of the three predictions holds across the twelve pairs, so the paper cannot say why swaps break.", "when": "When the three prediction analyses run, between 7 and 15 December 2026.", "what_it_costs": "The paper stays at the minimum bar and is less competitive at ICML.", "how_to_notice": "The tests on the dated prediction file come out as fails.", "restaurant": "The restaurant guessed that ratings survive when the new chef cooks like the old one, but the 12 restaurants do not show that pattern."}, {"item": "The rule: calibrated discount recovers most of the ceiling", "what_can_go_wrong": "A few fresh checks are not enough to set the trust weight well.", "when": "When the calibrated arm is scored with 8, 16, 32 or 64 fresh checks.", "what_it_costs": "The practical rule, the main thing a practitioner takes away, is weaker.", "how_to_notice": "The calibrated arm sits close to Wipe or Keep instead of close to Re-scored.", "restaurant": "Sixteen test plates by Chef Suresh do not tell the restaurant much more than having no rating at all."}, {"item": "Evidence quality: prediction file, paired tests, intervals, cost table, full release", "what_can_go_wrong": "One piece is missing, for example the cost table or the release of raw answers.", "when": "In the last weeks before submission on 22 January 2027.", "what_it_costs": "Reviewers ask for it, and the paper misses both bars, because this row is the same for both.", "how_to_notice": "A check against the list in \"What to collect\" finds a file that was never kept.", "restaurant": "The restaurant cannot show the jury the dated note of what it expected or the bill for the test plates."}]}}, {"title": "First: scores must work at home", "plain": "Concordance means: take two stored items whose outcomes differ, and check if the one with the higher score did better. A value of 0.5 is a coin toss. The minimum bar asks for at least 0.60 with the old model, for one of the two score types; the target asks for both types. If the scores are weak even before any swap, there is nothing to carry over.", "restaurant": "Before asking whether Ravi's ratings survive Suresh, check that they meant something under Ravi. Take two dishes where customers really liked one more. If the higher-rated dish was the better one only half the time, the ratings were noise all along.", "app": "The same check applies to the application: with today's model, does a stored solution shown as \"judged correct 9 of 10\" really work better than one with a lower count? Only if it does is the question of carrying it to a new model worth asking.", "table": null, "risks": null}, {"title": "The swap effect and why it happens", "plain": "The minimum bar asks only that the effect is measured for each pair, with error bars and with the noise floor, whatever its size. The target asks for a clear result: a drop larger than the noise floor in a clear group of pairs, or a tight \"no drop\" within 3 points shown by an equivalence test. The target also asks that at least one of the three registered predictions holds across all twelve pairs, so the paper can say which swaps break and why.", "restaurant": "The minimum is to report, for each of the 12 restaurants, how much the old ratings slipped and how sure we are. The target is to say something clear, for example \"ratings broke whenever the new chef came from a different cooking school\", and to have predicted that before tasting.", "app": "Not applicable: the application has had one model change at a time and does not record which model a judgement was made with, so it cannot measure a per-pair effect.", "table": null, "risks": null}, {"title": "The rule for the day of the change", "plain": "The minimum bar asks that Keep, Wipe and the discount rules are compared. The target asks more: that the calibrated discount gets most of the way to the ceiling, which is re-scoring everything with the new model, from a small number of fresh checks that the paper states.", "restaurant": "Re-rating every dish under Suresh is the best answer but costs many plates. The target is to show that cooking only 16 plates and setting trust from them (0.90 becomes 0.54 when trust is 0.10) gives nearly the same menu.", "app": "Today the application does Keep. If the paper reaches the target, the owner would have a tested way, at the next model change (for example from Claude Sonnet to DeepSeek on the laptop), to re-check a few stored solutions and set how much to trust the old \"judged correct\" counts.", "table": null, "risks": null}, {"title": "Try it: check results against the bars", "plain": "The page has a small form to fill in what the results have and see which bar they meet. Its example values meet the minimum but not the target: the five boxes for the minimum are ticked, and the four target-only boxes are not. The example numbers are made up, not results.", "restaurant": "The restaurant fills in a checklist before entering the award: 12 restaurants tested, ratings meant something under the old chef for one kind of rating but not the other. That is enough for the food guide, not yet for the famous award.", "app": "Not applicable: the form checks the paper's results, which do not exist yet.", "table": {"caption": "The example filled in on the original page (made-up values)", "columns": ["Field", "Example value"], "rows": [["Public benchmarks", "2"], ["Models", "6"], ["Ordered swap pairs", "12"], ["Home concordance, value scores", "0.66"], ["Home concordance, counters", "0.55"], ["All seven arms run", "Ticked"], ["Swap effect measured per pair, with intervals and the noise floor", "Ticked"], ["Keep, wipe and discount compared", "Ticked"], ["The three predictions reported, pass or fail", "Ticked"], ["Prediction file, paired tests, intervals, cost table and full release", "Ticked"], ["Released-code leg done", "Not ticked"], ["A drop beyond the noise floor in a clear subset of pairs, or a tight no-drop result", "Not ticked"], ["At least one prediction holds across the twelve pairs", "Not ticked"], ["The calibrated discount recovers most of the ceiling from a few fresh checks", "Not ticked"]]}, "risks": null}]}, {"chapter": "Raise the chances", "summary": "This section explains that an open research gap is needed but does not by itself make acceptance likely, and lists what published acceptance rates really support: about one in four at ICML on a first try, and no support at all for a 95% chance. It then ranks ten actions that raise the odds, names things that do not, and gives the rules for moving from one venue to the next.", "steps": [{"title": "A gap is needed, not enough", "plain": "ICML reviewers score four things: soundness, presentation, significance and originality. An open gap helps only originality and significance. Soundness and presentation come from how well the work is done and written, and review committees disagree on about a quarter of papers. So even a strong paper with a real gap faces about one in four at ICML on a single try.", "restaurant": "Being the first restaurant to test whether ratings survive a chef change is new and interesting. But the award jury also tastes how well the dish is cooked and how it is plated. And two juries disagree on about a quarter of dishes, so even a great dish wins only about one time in four.", "app": "Not applicable: this is about how reviewers judge a paper, not about the application.", "table": null, "risks": null}, {"title": "What the published rates support", "plain": "No published rate supports a 95% chance of acceptance. The rates below are group rates for all papers of a kind, not a forecast for this paper. Separately, for a paper that meets every condition on the page, the researcher's own judgement is 80 to 92% for some peer-reviewed venue by January 2028; that is a judgement, not a published figure.", "restaurant": "A famous award takes about one dish in four. A restaurant that keeps entering, first two famous awards and then a respected food guide, has a good chance of being listed somewhere within about a year. No restaurant can be 95% sure of a prize.", "app": "Not applicable: acceptance odds have no link to how the application works.", "table": {"caption": "Published rates, as the original gives them (NeurIPS = the Conference on Neural Information Processing Systems; ICLR = the International Conference on Learning Representations)", "columns": ["Outcome", "Chance", "Basis"], "rows": [["ICML 2027, first try, team with an eligible reviewer", "About 27%", "ICML accepted 26.6% in 2026"], ["ICML 2027, first try, no eligible reviewer on the team", "About 11 to 15%", "At ICLR 2026 such papers were accepted at about half the usual rate"], ["A top-ranked venue after ICML and NeurIPS 2027", "About 39 to 45%", "Two attempts at about one in four each; a rejected paper does somewhat worse on its next try"], ["Some peer-reviewed venue after ICML, NeurIPS and the journal TMLR, by about January 2028", "57 to 84%", "TMLR accepted 46.3% of all submissions and 70.6% of fully reviewed ones in 2025"], ["95% somewhere", "Not supported", "Reached on paper only after seven to nine attempts in a row, into 2029 or 2030, using second-tier conferences and a general-science journal, and only if every attempt is independent of the last"]]}, "risks": {"caption": "Each outcome: what can go wrong and what it costs", "rows": [{"item": "ICML 2027, first try, team with an eligible reviewer (about 27%)", "what_can_go_wrong": "The paper is rejected, which is the most likely single outcome even for a strong paper.", "when": "At the first-stage notices on 23 February 2027 or the final decisions on 3 May 2027.", "what_it_costs": "Three to six months before the next venue, and the eligible author must still review from 24 February to 16 March 2027.", "how_to_notice": "The rejection notice; a first-stage rejection carries only a short justification.", "restaurant": "The dish does not win the famous award on the first entry, as happens to about three dishes in four."}, {"item": "ICML 2027, first try, no eligible reviewer on the team (about 11 to 15%)", "what_can_go_wrong": "Without an author who already has a paper at a listed venue, the odds fall to about half.", "when": "When the author list closes on 14 January 2027 without such an author.", "what_it_costs": "The first-try chance drops from about 27% to about 11 to 15%, and the team is limited to one paper.", "how_to_notice": "The eligibility check in \"Before you start\" finds no author with an accepted paper at a listed venue.", "restaurant": "No one in the team has won an award or can sit on a jury, so the entry starts at a disadvantage."}, {"item": "A top-ranked venue after ICML and NeurIPS 2027 (about 39 to 45%)", "what_can_go_wrong": "Both tries are rejected, partly because a rejected paper does somewhat worse next time.", "when": "After the NeurIPS 2027 decision, later in 2027.", "what_it_costs": "The paper goes to TMLR, about a year after the first submission.", "how_to_notice": "Two rejection notices in a row.", "restaurant": "The dish misses both famous awards and goes to the respected food guide instead."}, {"item": "Some peer-reviewed venue by about January 2028 (57 to 84%)", "what_can_go_wrong": "Even after three tries the paper is not published, which the 57 to 84% range leaves open.", "when": "By about January 2028.", "what_it_costs": "The plan's rule then ends the attempts with an internal report.", "how_to_notice": "A TMLR rejection after the two conference rejections.", "restaurant": "Even the food guide declines the dish; the restaurant writes up its test for its own staff."}, {"item": "95% somewhere (not supported)", "what_can_go_wrong": "Someone promises a 95% chance, and the promise is broken.", "when": "When the odds are presented, for example to a manager.", "what_it_costs": "Lost trust in the person who promised it.", "how_to_notice": "Any sentence that offers 95%; the page says nobody can.", "restaurant": "A restaurant promises its owner a 95% sure prize, which no award's record supports."}]}}, {"title": "Try it: the venue ladder", "plain": "The page has a calculator. You choose whether one author already has a paper at a listed venue, and which TMLR rate to use: 70.6% for fully reviewed papers or 46.3% for all submissions. You tick venues in order and see the chance of acceptance somewhere by each step, once if every try is independent and once on a cautious reading. A red mark shows 95%.", "restaurant": "The restaurant lists which awards it will enter, in order, and sees how its chance of being listed somewhere grows with each entry. The cautious line assumes that a dish turned down once is judged a little more harshly the next time. The 95% mark stays out of reach.", "app": "Not applicable: the calculator is about publication odds.", "table": {"caption": "Assumptions the calculator uses, from the original", "columns": ["Setting", "Value used"], "rows": [["ICML rate without an eligible author", "13%, about half its usual rate, following ICLR 2026"], ["TMLR rate, fully reviewed papers", "70.6%"], ["TMLR rate, all submissions", "46.3%"], ["Cautious reading", "Later tries at about two-thirds of the usual rate, following the NeurIPS 2021 experiment"], ["Red mark", "95%"], ["Status", "Group rates from each venue's published figures, applied in order; not forecasts for this paper"]]}, "risks": null}, {"title": "How to say it", "plain": "The page gives one sentence to use when talking about the odds: \"Our aim is ICML. The realistic expectation is a peer-reviewed paper within about a year of submission, at roughly 60 to 85%. We raise those odds with ten specific actions. We cannot promise any single venue, and nobody can offer 95%.\"", "restaurant": "The restaurant tells its owner: \"We are aiming for the famous award. Realistically we expect to be listed by some respected guide within about a year. We will do ten things to improve our chances, but nobody can promise a prize.\"", "app": "Not applicable: this is wording for a conversation about the paper.", "table": null, "risks": null}, {"title": "Ten actions, ranked", "plain": "The page ranks ten actions that raise the odds. The ranking is a judgement. Each action is marked Measured (a difference between groups of papers, not a proven cause), Official (from the venue's own rules or forms) or Advice. OpenReview is the website where authors and reviewers keep their profiles and submit.", "restaurant": "These are the ten things the restaurant does before entering the award: bring an experienced chef onto the team, make the first bite count, fix what juries usually complain about, claim only what the tasting showed, publish the recipe, prepare answers to the jury, plate it cleanly, compare honestly with rival dishes, finish early, and enter the right category.", "app": "Not applicable: these are actions for writing and submitting the paper.", "table": {"caption": "The ten actions, in the original's order", "columns": ["Rank", "Action", "Kind", "Evidence"], "rows": [["1", "Build the author list around real contributors, including one experienced author. Check each author's eligibility, fix every OpenReview profile before 14 January, and protect the reviewing author's time from 24 February to 16 March.", "Measured", "At ICLR 2026, 8.8% of one-author submissions were accepted against 24 to 26% for three to five authors (one year of data)."], ["2", "Write the first page for the first-stage reader: the question, what was measured, the headline per pair, the rule, the limits. No format, anonymity or disclosure fault. Re-read the ICML pages in late November, when process updates are due.", "Official", ""], ["3", "Close the gaps reviewers name before you submit: a second prompt wording, the no-memory arm, a cost table, the number of items per pair, the noise floor.", "Measured", "In a labelled sample of 500 rejected ICLR papers, 48% failed on execution alone."], ["4", "Claim only what the intervals support, per pair, with limits up front.", "Official", "The ICML form says authors \"should be rewarded rather than punished for being up front about the limitations\"."], ["5", "Release code, prompts, raw answers and probe tables at submission.", "Measured", "At ICLR from 2017 to 2025, 44% of papers with code or data were accepted against 33% without."], ["6", "Prepare the rebuttal in advance and answer every reviewer with numbers.", "Measured", "At ICLR 2024 and 2025, 17 to 23% of reviews raised their score after replies and 1% lowered it."], ["7", "Make it easy to read: short sentences, a figure and main table that stand alone, exact prompts easy to find, written by the authors.", "Official", "Presentation is one of four scored dimensions."], ["8", "Position the paper against the closest work point by point and check every reference by hand.", "Measured", "Invented references caused desk rejections at ICLR 2026."], ["9", "Freeze early, get one experienced outside reader, register the abstract days ahead.", "Advice", "At ICLR 2026 the earliest fifth of abstracts was accepted at 31.1% against 22.8% for the last fifth, which is an association only."], ["10", "Choose the right contribution type and keep the NeurIPS and TMLR versions ready.", "Official", "Evaluation papers are accepted at about the conference average."]]}, "risks": {"caption": "What happens if an action is skipped", "rows": [{"item": "1. Author list with real contributors and one experienced author", "what_can_go_wrong": "The team has no eligible reviewer, or that author misses the reviewing window.", "when": "When the list closes on 14 January 2027, or during reviewing from 24 February to 16 March 2027.", "what_it_costs": "Lower odds, a one-paper limit, and possible desk rejection for reviewer violations.", "how_to_notice": "The eligibility check finds nobody, or the reviewing author has not registered.", "restaurant": "The restaurant enters with no chef who has ever won or judged, and its juror misses the tasting days."}, {"item": "2. First page written for the first-stage reader", "what_can_go_wrong": "The first-stage reader rejects the paper before full review.", "when": "At the first-stage rejection notices on 23 February 2027.", "what_it_costs": "The paper never reaches full reviewers and gets only a short justification.", "how_to_notice": "A first-stage rejection notice.", "restaurant": "The jury tastes the first bite, does not see the point, and sends the dish back before the main tasting."}, {"item": "3. Close the gaps reviewers name", "what_can_go_wrong": "A missing second prompt wording, no-memory arm, cost table, item count or noise floor is used against the paper.", "when": "In the reviews.", "what_it_costs": "Rejection on execution, the reason in 48% of a labelled sample of 500 rejected ICLR papers.", "how_to_notice": "Reviews that ask for one of these five items.", "restaurant": "The jury asks \"what does it taste like with no sauce at all?\" and the restaurant never tried it."}, {"item": "4. Claim only what the intervals support", "what_can_go_wrong": "A claim goes beyond what the error bars show.", "when": "When writing the abstract, title and results.", "what_it_costs": "Reviewers lose trust; the ICML form says being up front about limits should be rewarded.", "how_to_notice": "A claim with no interval behind it, or one stated for all pairs when only some show it.", "restaurant": "The menu says \"best biryani in town\" after only 16 plates were tasted."}, {"item": "5. Release code, prompts, raw answers and probe tables", "what_can_go_wrong": "Nobody can check or re-run the study, especially after the models retire.", "when": "At submission on 22 January 2027.", "what_it_costs": "Papers with code or data were accepted at 44% against 33% without, at ICLR from 2017 to 2025.", "how_to_notice": "The anonymised repository is not ready on submission day.", "restaurant": "The restaurant will not show the recipe, so the jury cannot check how the dish was made."}, {"item": "6. Prepare the rebuttal in advance", "what_can_go_wrong": "Replies to reviewers are rushed or have no numbers.", "when": "During the reply period after reviews arrive.", "what_it_costs": "A missed chance: 17 to 23% of reviews raised their score after replies at ICLR 2024 and 2025.", "how_to_notice": "No reply draft exists when the reviews arrive.", "restaurant": "A juror asks a question and the chef has no answer ready."}, {"item": "7. Make it easy to read", "what_can_go_wrong": "Reviewers cannot follow the figure, the table or the prompts.", "when": "When reviewers read the paper.", "what_it_costs": "A lower score on presentation, one of the four scored dimensions.", "how_to_notice": "The one outside reader cannot explain the main figure without help.", "restaurant": "A good dish served on a messy plate loses points."}, {"item": "8. Position against the closest work and check every reference by hand", "what_can_go_wrong": "A reference is wrong or invented, or a close paper is missed.", "when": "In the last week, when every reference is checked (15 to 22 January 2027).", "what_it_costs": "Invented references caused desk rejections at ICLR 2026.", "how_to_notice": "A reference that cannot be opened, or a reviewer naming a close paper that is not discussed.", "restaurant": "The restaurant cites a food magazine review that does not exist, and the jury finds out."}, {"item": "9. Freeze early, one outside reader, abstract days ahead", "what_can_go_wrong": "The paper is finished in a rush at the deadline.", "when": "In the last week before 14 and 22 January 2027.", "what_it_costs": "More mistakes; early abstracts were accepted at 31.1% against 22.8% for the last fifth at ICLR 2026, an association only.", "how_to_notice": "Experiments still running after the freeze on 15 December 2026.", "restaurant": "The dish is still being changed as the jury sits down."}, {"item": "10. Right contribution type, NeurIPS and TMLR versions ready", "what_can_go_wrong": "The wrong type is chosen, or the next version is not ready after a rejection.", "when": "When the type is chosen at submission, and after the ICML decision.", "what_it_costs": "A poor fit with reviewers, or a missed NeurIPS deadline that may fall days after the ICML decision.", "how_to_notice": "No NeurIPS version exists in April 2027.", "restaurant": "The dish is entered in the wrong category, and there is no entry ready for the next award."}]}}, {"title": "What does not move the odds", "plain": "Some things make no measured difference: title style such as a question mark or a colon, uploading supplementary material by itself, posting a preprint before review (under 4 points in most settings studied), and an industry affiliation (no consistent effect under anonymous review). The page has a short quiz on this. The measured items are differences between groups of papers, not proven causes.", "restaurant": "A fancy name for the dish, extra leaflets on the table, telling people about the dish before the award, or being a chain restaurant instead of a family one: none of these changes how the jury scores the food.", "app": "Not applicable: this is about publishing the paper.", "table": {"caption": "The quiz: does this raise the chance?", "columns": ["Choice", "Answer", "Why, from the original"], "rows": [["A question mark in the title", "Does not", "At ICLR 2026, titles with a question mark were accepted at 24.2%, against 27.0% overall."], ["Releasing code and data at submission", "Raises it", "At ICLR from 2017 to 2025, 44% of papers with code or data were accepted, against 33% without."], ["Posting the paper on arXiv (the public preprint website) before review", "Does not", "In most settings studied at ICLR from 2018 to 2022, the difference was under 4 points."], ["Replying to every reviewer with numbers", "Raises it", "At ICLR 2024 and 2025, 17 to 23% of reviews raised their score after replies, and 1% lowered it."], ["An industry affiliation", "Does not", "Under anonymous review, studies found no consistent effect either way."], ["A team of several authors, including an experienced one", "Raises it", "At ICLR 2026, 8.8% of one-author submissions were accepted, against 24 to 26% for three to five authors."], ["Stating the limits of the study openly", "Raises it", "The ICML review form tells reviewers to reward authors for being up fro
