  <h1>The model-swap paper, explained</h1>
  <p>The paper plan "Do Memory Scores Survive a Model Swap?" told plainly, section by section, with one restaurant story and with your own application. Choose a chapter, then press <b>Next</b> (or the right arrow key). No fact, number or date of the plan is changed.</p>

<script>
const DATA = [{"chapter": "The question in one restaurant", "summary": "A rating earned while one chef cooked may not be right once a new chef cooks the same dish, and the paper asks what the menu should show on the new chef's first day. The owner's application has the same situation: the admin's judgements on stored solutions were earned with one AI model, and that model will be replaced.", "steps": [{"title": "A rating earned under one chef", "plain": "A stored answer carries a score that says how often it helped. That score was earned while one particular AI model was doing the work. The score is really a record of how well that model used the answer.", "restaurant": "The menu shows how customers rated each dish. The Chicken Biryani has 9 good ratings of 10. All ten ratings were earned while Chef Ravi cooked it.", "app": "The dish is a stored solution on the procedural graph, for example for the Write that never completed in sample S17, row 155: \"replay these 6 commands with this gap\". The rating is the admin's judgements from the four buttons (correct, correct with edits, wrong, wrong with edits), shown as \"judged correct 9 of 10\". The chef is the AI model that writes the proposals, today Claude Sonnet.", "table": {"caption": "The same three parts in the story and in the application", "columns": ["Part", "In the restaurant", "In the owner's application"], "rows": [["The thing that is stored", "The Chicken Biryani recipe", "A stored solution, e.g. for S17 row 155: \"replay these 6 commands with this gap\""], ["The rating", "9 good ratings of 10 from customers", "\"judged correct 9 of 10\" from the admin's four buttons"], ["Who did the work when the rating was earned", "Chef Ravi", "The AI model that writes the proposals (today Claude Sonnet)"]]}, "risks": null}, {"title": "The chef changes", "plain": "Models are replaced: the vendor retires them, or the team moves to another one. The new model may use the same stored answer in a different way. So the question is: is the old score still right, and what should you do with it on the day of the change?", "restaurant": "Ravi leaves. Chef Suresh joins and cooks the same recipe differently. On Suresh's first day the menu still says \"9 of 10\", but none of those ratings were for Suresh's cooking.", "app": "On the laptop the model may be DeepSeek instead of Claude Sonnet, and next year there will be a newer model. The \"9 of 10\" on a stored solution was earned with the old model.", "table": null, "risks": null}, {"title": "Four things the menu can do on the first day", "plain": "There are four simple choices. Keep the old score, wipe it back to the starting value, cut it by a fixed amount, or test the new model on a few fresh cases first and trust the old score only as much as the tests agree with it. The numbers below are made up to show the idea.", "restaurant": "The restaurant can Keep \"9 of 10\", Wipe it, show it at a Fixed discount (\"half believable\"), or go Calibrated: Suresh cooks 16 plates first, customers rate them, and the old rating is trusted as much as the 16 plates agree with it. If the 16 plates give a trust of 0.10, the 0.90 becomes 0.50 + 0.10 x (0.90 - 0.50) = 0.54.", "app": "Today the application does Keep, and it does not record which model a judgement was made with. So it cannot yet tell which judgements came from which model, and it could not use any of the other three choices without that record.", "table": {"caption": "Tip A (the Chicken Biryani) earned 0.90 under the old chef or model. What it starts with under the new one (made-up numbers)", "columns": ["Choice", "What it does", "Tip A starts with", "How it is worked out", "Cost on the day"], "rows": [["Keep", "Trust the old score fully", "0.90", "Unchanged", "Nothing"], ["Wipe", "Reset to the starting value of 0.50", "0.50", "Every score goes back to 0.50", "Nothing to run, but all past learning is thrown away"], ["Fixed discount", "Trust the old score halfway, the same way at every change", "0.70", "0.50 + 0.50 x (0.90 - 0.50)", "Nothing"], ["Calibrated", "Run 16 fresh cases with the new model first; trust the old score as much as they agree", "0.54", "Trust 0.10: 0.50 + 0.10 x (0.90 - 0.50)", "16 fresh cases"]]}, "risks": {"caption": "Risks of the four choices, read for the owner's application", "rows": [{"item": "Keep", "what_can_go_wrong": "A solution keeps its \"judged correct 9 of 10\" and is shown first even though the new model writes it badly.", "when": "When the new model uses or writes the stored solution differently from the model that earned the judgements.", "what_it_costs": "The admin is shown a weak proposal first and spends time judging it, while the ranking looks trustworthy.", "how_to_notice": "The admin presses \"wrong\" more often on top-ranked solutions after the change, but today nothing says which model each judgement came from.", "restaurant": "Customers order the biryani because of \"9 of 10\" and get Suresh's version, which may not be as good."}, {"item": "Wipe", "what_can_go_wrong": "Every judgement the admin made is thrown away, even where the new model would do just as well.", "when": "At every model change, including small ones where nothing important changed.", "what_it_costs": "Weeks of the admin's judgements are lost, and good solutions lose their place until they are judged again.", "how_to_notice": "Rankings fall back to matching alone, and solutions the admin already approved stop appearing first.", "restaurant": "The menu shows no rating at all, so customers cannot tell the best dish from the worst."}, {"item": "Fixed discount", "what_can_go_wrong": "The same cut is applied whether the new model is almost the same or very different.", "when": "When the new model differs a lot (the cut is too small) or hardly at all (the cut is too large).", "what_it_costs": "Either a weak solution still comes first, or good learning is thrown away for no reason.", "how_to_notice": "Only by comparing with fresh judgements under the new model, which this choice never takes.", "restaurant": "The menu shows the biryani at 0.70 whether Suresh cooks it like Ravi or completely differently."}, {"item": "Calibrated", "what_can_go_wrong": "The 16 fresh cases may be too few or not typical, so the trust it sets is partly luck.", "when": "When the 16 cases cover only easy or unusual defects, or the old and new models differ only on rare cases.", "what_it_costs": "It costs 16 fresh proposals that the admin must judge, and a wrongly set trust still misranks solutions.", "how_to_notice": "The trust value changes a lot if the 16 cases are drawn again, or later judgements disagree with it.", "restaurant": "If the 16 plates all go to regulars who loved Ravi's taste, the trust says more about them than about Suresh."}]}}, {"title": "What the paper measures", "plain": "The paper tries all these choices on 12 real model changes, using public data. It measures which choice works best and how few fresh checks the calibrated choice needs. The experiment has not been run yet.", "restaurant": "It is like visiting 12 restaurants that each changed chef, and checking in each one which of the four menu choices would have pointed customers to the best dish. It also checks how few test plates the new chef must cook before the calibrated choice is reliable.", "app": "The result would give the application a tested rule for its next model change, and an upgrade check to run at every change, instead of a guess.", "table": null, "risks": null}, {"title": "Where the owner's application stands today", "plain": "The application uses Keep today. It does not store which model was running when the admin made each judgement. The original plan lists \"a model field on stored items\" as something the project's own audit already says is missing.", "restaurant": "The restaurant keeps every old rating as it is and never wrote down which chef cooked each rated plate. When Suresh's plates start to get worse ratings, it cannot tell whether the dish or the chef is the cause.", "app": "In the application, the code, not the model, decides where a case is stored, so the original predicts the scores stay safe after a change. That prediction is only checkable once each judgement records the model that made the proposal.", "table": null, "risks": {"caption": "Risk of the application's current choice", "rows": [{"item": "Keep, with no record of the model", "what_can_go_wrong": "Old judgements and new judgements are mixed into one \"judged correct s of n\" that no one can split again.", "when": "From the first day a different model (for example DeepSeek on the laptop) writes proposals.", "what_it_costs": "If the new model turns out worse, there is no way to undo or discount only the old judgements.", "how_to_notice": "It cannot be noticed from the stored data at all; only a model field added before the change makes it visible.", "restaurant": "Ratings from Ravi's and Suresh's plates are added into one number, and nobody can say whose cooking the 9 of 10 describes."}]}}]}, {"chapter": "Why this paper", "summary": "This section explains the question and then gives five reasons from published work why it matters: one claim was never tested, one failing case is already in print, model changes are forced, effects can reverse with direction, and usefulness depends on the model reading the item. It ends with what twelve close papers did and did not do, and how thin but real the link is to the owner's project.", "steps": [{"title": "The question", "plain": "An AI helper keeps a store of tips, and each tip has a score that says how often it helped. The scores were earned with one model. When that model is replaced, are the scores still right, and what should you do with them on the day of the change? The paper measures which rule works best across 12 real model changes.", "restaurant": "This is the chef story from the first chapter: the biryani's \"9 of 10\" was earned under Ravi, and the question is what the menu should show on Suresh's first day.", "app": "The tips are the stored solutions on the procedural graph, the scores are \"judged correct s of n\", and the model is the one that writes the proposals.", "table": {"caption": "The original's four rules for Tip A, which earned 0.90 with the old model (numbers made up)", "columns": ["Rule", "Score Tip A starts with", "What the original says about it"], "rows": [["Keep", "0.90", "Trust the old score fully. Costs nothing, but wrong if the new model uses the tip differently."], ["Wipe", "0.50", "Reset to the starting value. Safe, but everything learned with the old model is thrown away."], ["Fixed discount", "0.70", "Trust the old score halfway, the same way at every model change."], ["Calibrated", "0.54", "First run 16 fresh cases with the new model; here the checks set trust to 0.10. Costs 16 fresh cases."]]}, "risks": {"caption": "What each rule risks for a general AI helper (the owner's version is in the first chapter)", "rows": [{"item": "Keep", "what_can_go_wrong": "A tip with a high old score is shown first although it helps the new model less.", "when": "When the new model uses the tip differently.", "what_it_costs": "Wrong answers until the scores are earned again.", "how_to_notice": "Success drops after the change while the old top tips stay on top.", "restaurant": "The biryani keeps \"9 of 10\" while Suresh's version disappoints."}, {"item": "Wipe", "what_can_go_wrong": "Useful learning is thrown away.", "when": "At every change, even when the scores were still right.", "what_it_costs": "The helper starts from zero and must earn every score again.", "how_to_notice": "The best tips stop coming first right after the change.", "restaurant": "Every dish loses its rating on Suresh's first day."}, {"item": "Fixed discount", "what_can_go_wrong": "The same cut fits some changes and not others.", "when": "When the change is much larger or much smaller than the cut assumes.", "what_it_costs": "Too much or too little trust in old scores.", "how_to_notice": "Only visible if fresh results are compared, which this rule does not do.", "restaurant": "Every dish is shown as \"half believable\" whatever Suresh is like."}, {"item": "Calibrated", "what_can_go_wrong": "Sixteen fresh cases may give a trust value that is partly luck.", "when": "When the fresh cases are few or unusual.", "what_it_costs": "The 16 fresh cases, plus any misranking from a wrong trust.", "how_to_notice": "The trust value moves a lot between repeated draws of 16 cases.", "restaurant": "Sixteen test plates on a quiet day may not show how Suresh really cooks."}]}}, {"title": "1. A published claim that was never tested", "plain": "MemRL, accepted at NeurIPS 2026 (the Conference on Neural Information Processing Systems, a top machine-learning venue), gave a memory store built with one model (Gemini-3-pro) to three other models. All three did better on the HLE benchmark (Humanity's Last Exam, a set of hard questions). The paper then suggested that the scores themselves carry over, but it never ran the store with the scores removed, so the gain could come from the stored content alone. MemRL's own appendix says its gains on this benchmark stem from memorising answers at run time.", "restaurant": "A famous food magazine reported that a new chef did better with the old restaurant's recipe book and its ratings, and wrote that the ratings carry over. But it never hid the ratings to check. The recipes alone may have done all the work.", "app": "Not applicable: this is about a published paper's evidence, not about anything the owner's application does.", "table": {"caption": "Task success on HLE, from MemRL's Table 5 (version 2). Store built with Gemini-3-pro", "columns": ["Model given the memory", "Base model", "With the memory store", "Same store, scores removed", "Do old scores still rank right?"], "rows": [["Qwen3-235B", "0.150", "0.531", "Not measured", "Not measured"], ["Gemini-3-flash", "0.347", "0.583", "Not measured", "Not measured"], ["GPT-5.2 (High)", "0.354", "0.571", "Not measured", "Not measured"]]}, "risks": {"caption": "What can go wrong if this result is read as proof", "rows": [{"item": "Reading MemRL's gain as \"scores carry over\"", "what_can_go_wrong": "The gain may come from the stored content, not from the scores.", "when": "Whenever a store helps a new model but the scores were never removed to compare.", "what_it_costs": "A team keeps old scores believing they were proven safe, when they were not tested.", "how_to_notice": "Run the same store with the scores removed; if it scores as high, the scores did nothing.", "restaurant": "The magazine praised the ratings, but the recipes alone may have made the food good."}]}}, {"title": "2. A failing case already in print", "plain": "CHIME, a September 2026 preprint (a paper shared publicly before peer review), moved a memory store between two models and also let each model build its own. On the tau2-Bench task (a benchmark of customer-service style conversations), memory moved from Qwen to DeepSeek added only 0.78 points, while DeepSeek's own memory added 6.24. In the other direction the moved memory did as well as Qwen's own, slightly better. CHIME reports these cells without error bars, so part of the difference may be chance, and the paper does not discuss this.", "restaurant": "One restaurant gave Ravi's recipe notes to Suresh, and they barely helped him, while Suresh's own notes helped a lot. When Suresh's notes went the other way, to Ravi, they worked as well as Ravi's own. Whether the notes carry over depends on which chef is receiving them.", "app": "Not applicable: the application does not move memory between models in two directions; it is evidence for the general question.", "table": {"caption": "CHIME on tau2-Bench (points; no error bars reported)", "columns": ["Direction", "Setting", "Score"], "rows": [["Qwen to DeepSeek", "No memory", "30.04"], ["Qwen to DeepSeek", "Memory moved from Qwen", "30.82"], ["Qwen to DeepSeek", "DeepSeek's own memory", "36.28"], ["DeepSeek to Qwen", "Memory moved from DeepSeek", "26.40"], ["DeepSeek to Qwen", "Qwen's own memory", "25.92"]]}, "risks": {"caption": "What can go wrong if this result is ignored or over-read", "rows": [{"item": "Assuming moved memory always helps", "what_can_go_wrong": "Most of the benefit may not carry over to the new model.", "when": "In some directions of a model change, like Qwen to DeepSeek here.", "what_it_costs": "The new model runs with memory that adds little, while its own would add much more.", "how_to_notice": "Compare moved memory with the new model's own memory, as CHIME did.", "restaurant": "Suresh follows Ravi's notes and his food barely improves."}, {"item": "Trusting single numbers without error bars", "what_can_go_wrong": "A small difference may be luck, not a real effect.", "when": "When results are reported once with no spread.", "what_it_costs": "A wrong conclusion in either direction.", "how_to_notice": "Repeat the runs and report error bars.", "restaurant": "One evening's ratings may just be a lucky or unlucky night."}]}}, {"title": "3. The model change is forced", "plain": "Teams do not choose when to change models. Vendors retire them on a schedule, sometimes with about two months' notice. A team that keeps scored memory beside a rented model will face this decision again and again: with a helper that runs 3 years and models that last 14 months, that is about 2 forced changes.", "restaurant": "The restaurant does not choose when chefs leave. The agency that supplies chefs moves them on, sometimes with two months' notice. A restaurant open for 3 years will change chef more than once.", "app": "The application rents its model (today Claude Sonnet), and the original says the model under the tool already changed more than once during development. Each change is a day when someone must decide what to do with the stored judgements.", "table": {"caption": "Retirement examples read from vendor pages on 15 November 2026 in the first research round (confirm on the vendor's page before quoting)", "columns": ["Model", "What happens", "Date"], "rows": [["Claude Sonnet 4.5", "Retires", "30 November 2026"], ["Gemini 2.5 Pro", "Moves to a newer model", "1 December 2026"], ["GPT-5 (OpenAI)", "Shut down", "11 December 2026"], ["GPT-4o family (OpenAI)", "Shut down", "14 January 2027"], ["Recent Claude models", "Lived about 12 to 14 months", "-"]]}, "risks": null}, {"title": "4 and 5. The effect depends on direction and on the reader", "plain": "Goyal and Ray, a September 2026 preprint, moved written notes between two open models: one way they helped by 9.91 points, the other way they hurt by 13.28 points, so a simple average (about -1.7) hides two large, opposite effects; the paper's own pooled test, on a different measure, gave -1.47. A November 2026 preprint (arXiv 2611.03930; arXiv is a public preprint site) checked, for each stored item and question, whether the item helped under each of two models. They agreed on 225 of 275 cases (82%), a Cohen's kappa of 0.58, which is only moderate (kappa measures agreement after removing agreement by chance: 1 is perfect, 0 is no better than guessing). That preprint studies no stored scores, so it supports the idea without answering this paper's question.", "restaurant": "Ravi's notes made Suresh's food better, but Suresh's notes made Ravi's food worse; averaging the two makes it look as if notes do nothing. And when two chefs each taste whether a side-note helps a dish, they agree on 225 of 275 tastings: often, but far from always. Whether a note is useful depends on which chef reads it.", "app": "This is why a stored solution's usefulness may depend on the model writing the proposal. The paper therefore reports every direction of a change separately, and the application would need to record which model each judgement came from.", "table": {"caption": "The two results in numbers", "columns": ["Study", "Result"], "rows": [["Goyal and Ray: notes moved one way", "+9.91 points"], ["Goyal and Ray: notes moved the other way", "-13.28 points"], ["Simple average of the two", "-1.69 points (about -1.7)"], ["Goyal and Ray's own pooled test (different measure)", "-1.47 points"], ["arXiv 2611.03930: two models agree on whether an item helps", "225 of 275 cases (82%); 50 disagree; kappa 0.58"]]}, "risks": {"caption": "What can go wrong when these effects are hidden", "rows": [{"item": "Averaging both directions of a change", "what_can_go_wrong": "A large gain and a large loss cancel and look like \"no effect\".", "when": "When results for A-to-B and B-to-A are pooled.", "what_it_costs": "A harmful direction is missed, and the paper's conclusion would be wrong.", "how_to_notice": "Report each direction on its own, as this paper plans to.", "restaurant": "The menu says \"notes make no difference\" while one chef got better and the other got worse."}, {"item": "Treating usefulness as fixed", "what_can_go_wrong": "An item judged useful under one model may not help another.", "when": "In the cases where two models disagree, 50 of 275 in that preprint.", "what_it_costs": "Old scores rank some items wrongly for the new model.", "how_to_notice": "Check on fresh cases whether the old scores still pick the right items.", "restaurant": "A side-note one chef swears by is useless to the other."}]}}, {"title": "What is still open", "plain": "Twelve papers come close. Eight were read in full and four only from their abstracts or code. None of the eight read in full checks whether old scores still rank items correctly after a model change, or compares keep, wipe and discount.", "restaurant": "Twelve food magazines wrote about chefs changing. Some moved recipe books between chefs, some compared with a chef's own notes, but none of the ones read in full hid the ratings to see if they still pick the best dish, or compared keeping, wiping and discounting the ratings.", "app": "Not applicable: this is about other researchers' work.", "table": {"caption": "What each close paper did", "columns": ["Paper", "Moves scored memory to a new model", "Compares with the new model's own memory", "Tests if old scores still rank right", "Compares keep, wipe, discount"], "rows": [["MemRL (NeurIPS 2026)", "Yes", "No", "No", "No"], ["RoMeRL (preprint, Aug 2026)", "Yes", "No", "No", "No"], ["CHIME (preprint, Sep 2026)", "Yes", "Yes", "Same model only", "No"], ["EvoKernel (ICML 2026, the International Conference on Machine Learning)", "Unclear", "No", "No", "No"], ["Goyal and Ray (preprint, Sep 2026)", "Content only", "Yes", "No", "No"], ["MemCollab (preprint, May 2026)", "No scores", "Yes", "No", "No"], ["Memory Transfer Learning (preprint, Apr 2026)", "No scores", "Yes", "No", "No"], ["arXiv 2611.03930 (preprint, Nov 2026)", "No scores", "No", "Labels only", "No"], ["Xia et al. (preprint)", "Not read", "Not read", "Not read", "Not read"], ["HEIRS (ICLR 2027 submission; ICLR is the International Conference on Learning Representations)", "Not read", "Not read", "Not read", "Not read"], ["\"When Can a Skill Library Trust Its Execution Records?\" (ICLR 2027 submission)", "Not read", "Not read", "Not read", "Not read"], ["\"Beyond Semantic Relevance\" (ICLR 2027 submission)", "Not read", "Not read", "Not read", "Not read"], ["This paper (planned)", "Yes", "Yes", "Yes", "Yes"]]}, "risks": {"caption": "What can go wrong with the claim that the gap is open", "rows": [{"item": "The four papers not read in full", "what_can_go_wrong": "One of them may already compare keep, wipe and discount for numeric scores.", "when": "If HEIRS, \"When Can a Skill Library Trust Its Execution Records?\", Xia et al. or \"Beyond Semantic Relevance\" turns out closer than its abstract.", "what_it_costs": "The paper's claim of being first must narrow.", "how_to_notice": "Read the four papers in full before writing the claim.", "restaurant": "A magazine on the shelf, still unread, may already have run the hidden-rating test."}, {"item": "Not yet read: \"When Can a Skill Library Trust Its Execution Records?\"", "what_can_go_wrong": "It is the closest by title: fresh local trials against pooled records from other models, winning in two settings and losing in two.", "when": "If its records are scores of the same kind this paper studies.", "what_it_costs": "Part of the question may already be answered.", "how_to_notice": "Read it in full and compare its rules with keep, wipe and discount.", "restaurant": "Another magazine already compared \"cook 3 test plates\" with \"trust other restaurants' ratings\"."}]}}, {"title": "The link to your project", "plain": "The owner's tool and the paper deal with the same kind of thing: scores on stored answers, kept beside a model you rent. The paper studies the general case on public data, so the link is thin, and it is true. The paper uses no project or customer data.", "restaurant": "The paper studies many public restaurants changing chef. The owner's kitchen is one particular restaurant with one strict rule: the manager, not the chef, decides which shelf each recipe goes on.", "app": "In the tool, code, not the model, decides where a case is stored, so the paper predicts the scores stay safe after a change. What the owner gets is a tested rule for the next model change and an upgrade check.", "table": {"caption": "The same four parts in two settings", "columns": ["Part", "In your tool", "In the paper"], "rows": [["What is stored", "Fixes for drive failures, each designed to carry a tally of engineers' verdicts.", "Tips and past solutions on public tasks, each with a score from a program's grade or the model's own marking."], ["The model", "A rented language model. It changed more than once during development.", "Six models from three makers, switched in 12 ways."], ["Who decides where a case is stored", "Code, not the model. So the paper predicts your scores stay safe after a change.", "In most published systems the model does. That is where scores can go wrong."], ["What you get", "A tested rule for the next model change, and an upgrade check.", "A measurement of when old scores can be trusted, and a rule for the day of the change."]]}, "risks": null}]}, {"chapter": "The idea in one example", "summary": "A support helper ranks four tips by half relevance and half an old score, and the example shows what each rule for the old scores puts first after the model is replaced. All numbers are made up to show the idea; the experiment has not been run.", "steps": [{"title": "Four tips with old scores", "plain": "A support helper keeps four tips for one kind of failure. Each tip has a score earned with the old model: how often showing it led to a correct answer. Each tip also has a relevance (how well it matches the case) and, made up for the example, how often it helps with the new model.", "restaurant": "Think of four dishes for the same kind of order. Each has a rating earned under Ravi, a match to what the customer asked for, and (unknown to the menu) how good it is when Suresh cooks it. Tip A is like the Chicken Biryani: 0.90 under Ravi, only 0.55 under Suresh.", "app": "In the application the four tips would be four stored solutions for the same kind of defect (such as the Write that never completed in S17, row 155), and the old score would be the admin's \"judged correct s of n\".", "table": {"caption": "The four tips (all numbers made up)", "columns": ["Tip", "Relevance", "Old score (old model)", "Helps with the new model"], "rows": [["A: After a reset timeout, check the queue depth first.", "0.80", "0.90", "55%"], ["B: If a completion never arrives, compare the command ID with the abort log.", "0.79", "0.40", "85%"], ["C: A link retrain just before the error usually points to signal quality.", "0.84", "0.65", "70%"], ["D: Re-run the command once before escalating.", "0.70", "0.20", "40%"]]}, "risks": null}, {"title": "How the helper picks a tip", "plain": "When a case arrives, the helper ranks the tips by half relevance and half score, and shows the top one first. With the old model and the old scores, Tip A comes first (0.5 x 0.80 + 0.5 x 0.90 = 0.85). That is right: with the old model Tip A helps in 90% of cases, the best of the four.", "restaurant": "The waiter suggests a dish by mixing half \"matches your order\" and half the menu rating. While Ravi cooks, this points customers to the biryani, which is truly his best dish.", "app": "Not applicable: the original does not say the application ranks by half relevance and half score; this ranking belongs to the example only.", "table": null, "risks": null}, {"title": "The vendor retires the old model", "plain": "Now the new model runs the helper, but the scores are still the old ones. With Keep, Tip A still comes first, yet with the new model it helps in only 55% of cases. The best tip for the new model is Tip B at 85%, but its old score of 0.40 keeps it down.", "restaurant": "Suresh starts cooking. The waiter still recommends the biryani because of its old \"9 of 10\", but Suresh's biryani is only so-so. Suresh's best dish is one that rated poorly under Ravi, so nobody orders it.", "app": "This is the risk of the application's current Keep: a solution judged correct under Claude Sonnet keeps its top place even if a new model writes it worse.", "table": null, "risks": null}, {"title": "Each rule on the day of the switch", "plain": "The original lets you try five rules. Keep and a fixed discount of 0.50 both still show Tip A, a weak tip. Wipe and Calibrated (trust set to 0.10 by 16 fresh cases) show Tip C, a good tip but not the best. Only Re-score all finds Tip B, and it costs fresh runs on every tip in the store.", "restaurant": "Keeping or halving the old ratings still sends customers to Suresh's weak biryani. Wiping the ratings or calibrating with 16 test plates sends them to a good dish that is not his best. Only re-rating every dish under Suresh finds his best one, but that means cooking every dish for testers first.", "app": "In the application, Re-score all would mean the admin judging fresh proposals from the new model on every stored solution, which costs the most admin time.", "table": {"caption": "What each rule shows first (worked from the original's made-up numbers; ranking = 0.5 x relevance + 0.5 x score used)", "columns": ["Rule", "Score used for A / B / C / D (new model)", "Shown first with the new model", "Shown first with the old model", "Cost"], "rows": [["Keep", "0.90 / 0.40 / 0.65 / 0.20", "Tip A, helps 55%: weak tip shown first", "Tip A, helps 90%: best tip", "Nothing"], ["Wipe", "0.50 / 0.50 / 0.50 / 0.50", "Tip C, helps 70%: good tip, not the best", "Tip C, helps 65%: weak tip shown first", "Nothing"], ["Fixed discount (trust 0.50)", "0.70 / 0.45 / 0.575 / 0.35", "Tip A, helps 55%: weak tip shown first", "Tip A, helps 90%: best tip", "Nothing"], ["Calibrated (new model: trust 0.10; old model: full trust)", "0.54 / 0.49 / 0.515 / 0.47", "Tip C, helps 70%: good tip, not the best", "Tip A, helps 90%: best tip", "16 fresh cases"], ["Re-score all", "0.55 / 0.85 / 0.70 / 0.40", "Tip B, helps 85%: best tip", "Tip A, helps 90%: best tip", "Fresh runs on every tip in the store"]]}, "risks": {"caption": "Risks of the five rules in this example (made-up numbers)", "rows": [{"item": "Keep", "what_can_go_wrong": "A tip that was best for the old model stays on top after it stops being best.", "when": "Right after the switch, when the new model uses the tip differently.", "what_it_costs": "Here the shown tip helps 55% instead of the best 85%.", "how_to_notice": "Success on the top tip drops after the switch while its score stays high.", "restaurant": "The waiter keeps recommending the biryani that Suresh cooks poorly."}, {"item": "Wipe", "what_can_go_wrong": "Ranking falls back on relevance alone and ignores everything learned.", "when": "At every switch; with the old model it even loses the best tip.", "what_it_costs": "Here 70% instead of 85% with the new model, and 65% instead of 90% if the model had not really changed.", "how_to_notice": "Tips that were known to be good stop appearing first.", "restaurant": "With no ratings, the waiter recommends whatever sounds closest to the order."}, {"item": "Fixed discount", "what_can_go_wrong": "A halfway cut is not enough to move a tip that has become weak.", "when": "When the new model differs a lot from the old one.", "what_it_costs": "Here the same weak tip as Keep, at 55%.", "how_to_notice": "Only by fresh checks, which this rule does not make.", "restaurant": "\"Half believable\" still leaves the biryani on top."}, {"item": "Calibrated", "what_can_go_wrong": "With few fresh cases the trust may be set wrongly, and even a right trust may not find the very best tip.", "when": "When the 16 fresh cases are not typical, or the best tip had a low old score.", "what_it_costs": "16 fresh cases; here it reaches a good tip (70%) but not the best (85%).", "how_to_notice": "Compare its pick with later results under the new model.", "restaurant": "Sixteen test plates stop the biryani being pushed, but do not reveal Suresh's best dish."}, {"item": "Re-score all", "what_can_go_wrong": "It is the most expensive rule and may not be affordable for a large store.", "when": "Whenever the store has many tips.", "what_it_costs": "Fresh runs on every tip, which is why the original calls it the ceiling, not a practical rule.", "how_to_notice": "The bill for model calls, or the admin's time to judge every solution again.", "restaurant": "Every dish must be cooked for testers before the menu can be trusted."}]}}, {"title": "What to notice", "plain": "With the old model, keeping the scores picks the best tip. With the new model, the same scores push a weak tip to the top. Wiping them falls back on relevance, which is safer but not best, and only re-scoring finds the best tip at the cost of fresh runs on every tip. The paper measures how often each of these happens across 12 real model switches, and how few fresh checks the calibrated rule needs.", "restaurant": "Old ratings were right for Ravi and wrong for Suresh. The paper visits 12 restaurants that changed chef to see how often this happens, and how few test plates are enough to fix the menu.", "app": "For the application the answer would set its rule for the next model change, for example how many fresh proposals the admin should judge before trusting old \"judged correct\" counts again.", "table": null, "risks": null}]}, {"chapter": "Pitch to your manager", "summary": "Ask your manager for a small, staged approval: a one-week trial on public data, not a whole paper. Say the weak points yourself, give the odds plainly, and end by asking for four decisions.", "steps": [{"title": "Ask for a one-week pilot, not a paper", "plain": "Do not ask for permission to write a paper. Ask for one week to run a pilot (a small first trial) on public data. A small ask is easy to say yes to. The pilot's result then decides whether the rest goes ahead, and you decide it together on 22 November.", "restaurant": "The restaurant owner does not ask head office for a new menu on the day Chef Suresh joins. He asks for one trial week: Suresh cooks some plates, customers rate them, and at the end of the week five numbers decide whether to go on. A small, clear ask gets a quick yes.", "app": "You are not asking to change the application. You ask for one week to test, on public data, the question the application will face at its next model change: can \"judged correct 9 of 10\" still be trusted when a different model writes the proposals?", "table": {"caption": "What to say in about a minute, point by point (from the original's script)", "columns": ["Point", "What to say"], "rows": [["What our tool learns", "Our tool never trains a model. What it learns is kept as scores beside a language model we rent, and vendors retire those models on short notice. The model under our tool has already changed more than once during development."], ["What is known", "Published work shows that scored memory still helps after a model is replaced. Nobody has tested whether the scores themselves are still right, or what to do with them."], ["The plan", "Measure that on public benchmarks, with public data and about USD 700 (US dollars) of model calls, and write it up for ICML 2027 (the International Conference on Machine Learning, a top research conference)."], ["What it does not do", "It uses no company or customer data. It does not advance the project's sixteen deliverables."], ["What the project gets", "A repeatable check to run at every model change, and evidence for or against our decision to keep the model out of the keys."], ["The ask", "One week to run a pilot. On 22 November I show you five numbers, and we decide together whether to continue."], ["Before you speak", "Check the vendors' retirement notices on their own pages before you quote any date or notice period."]]}, "risks": null}, {"title": "Run the conversation in this order", "plain": "The order matters. Start with the ask and its size, then say the weak points before the manager finds them. Then say what the organisation gains, give the odds and the rule for when to stop, and end with the decisions you need.", "restaurant": "The owner tells head office: one trial week, small cost, decision on Friday. Then he admits the weak points himself: the trial uses a public tasting test, not our regular customers. A manager who hears the weak points from you trusts the rest of what you say.", "app": "The weak points to say first are true of the application: the link to the product is thin, the paper moves none of the sixteen deliverables, and the scores in the study are not engineers' verdicts from the four judgement buttons.", "table": {"caption": "The order of the conversation", "columns": ["Order", "What to do", "What it contains"], "rows": [["1", "Start with the ask and its size", "One week, public data, about USD 700, a go or no-go on 22 November."], ["2", "Say the weak points yourself, first", "The link to the product is thin, the paper moves none of the sixteen deliverables, and the scores in the study are not engineers' verdicts."], ["3", "Say what the organisation gains", "The list of four gains (next steps)."], ["4", "Give the odds plainly and the stopping rule", "The chances of acceptance and the order of venues to try (next step)."], ["5", "End with the four decisions you need", "Ask who decides each one."]]}, "risks": null}, {"title": "Give the odds plainly, and the stopping rule", "plain": "Nobody can promise that the paper will be accepted, and nobody can offer a 95% chance. The odds come from published acceptance rates for groups of papers. The stopping rule says in advance where the paper goes after each rejection, so a rejection is a planned step, not a surprise.", "restaurant": "Entering a famous food award with a jury: about one entry in four wins on the first try, even for a good kitchen, and juries often disagree. The owner says up front: we enter this award once, then a second award, then a trade magazine's review, and if all say no, we keep the recipe notes for ourselves.", "app": "Not applicable: the odds are about the paper being accepted. They say nothing about whether the application works.", "table": null, "risks": {"caption": "The odds and the stopping rule, as outcomes", "rows": [{"item": "About one in four at ICML on the first try, if the team includes an author with a prior top-venue paper", "what_can_go_wrong": "The paper is rejected at ICML even if it is good, because three of four papers are.", "when": "At the first-stage notices on 23 February 2027 or the final decisions on 3 May 2027.", "what_it_costs": "Three to six months before the next venue gives an answer.", "how_to_notice": "The ICML decision email.", "restaurant": "Three of four good kitchens do not win the famous award on the first try."}, {"item": "About half that, if no author has a prior top-venue paper", "what_can_go_wrong": "The chance at ICML drops to about 11 to 15%, and the team may submit only one paper.", "when": "If the author list is closed on 14 January 2027 without such an author.", "what_it_costs": "Most of the first-try chance.", "how_to_notice": "Check each author's record before the author list closes.", "restaurant": "A kitchen with no chef who has ever won an award gets about half the usual chance with the jury."}, {"item": "About 40% for a top-ranked venue after two tries (ICML, then NeurIPS)", "what_can_go_wrong": "Both top conferences say no. NeurIPS is the Conference on Neural Information Processing Systems, the other top venue in the ladder.", "when": "After the NeurIPS 2027 decision.", "what_it_costs": "The paper goes down the ladder to a journal.", "how_to_notice": "Two rejection notices.", "restaurant": "Two famous awards in a row both pass on the dish."}, {"item": "About 60 to 85% for some peer-reviewed paper by early 2028", "what_can_go_wrong": "Even the journal step can say no, so there is still a real chance of no published paper.", "when": "Early 2028, after the journal TMLR (Transactions on Machine Learning Research) has decided.", "what_it_costs": "The paper becomes an internal report only.", "how_to_notice": "The TMLR decision.", "restaurant": "Even the trade magazine's review may turn the dish down."}, {"item": "The stopping rule: one ICML attempt, one NeurIPS attempt, then TMLR, then an internal report", "what_can_go_wrong": "Without a fixed rule, the team keeps resubmitting and the work drags on.", "when": "After any rejection.", "what_it_costs": "Months of extra effort with no end date.", "how_to_notice": "Count the attempts against the rule.", "restaurant": "The owner writes down beforehand which awards to enter and when to stop."}, {"item": "Anyone who offers 95%", "what_can_go_wrong": "A promise the published rates do not support damages your credibility when the first rejection comes.", "when": "When the manager hears a confident promise and then a rejection.", "what_it_costs": "Trust for the next request.", "how_to_notice": "If a number above the ones in this list is quoted, it has no source.", "restaurant": "Promising the owner that the dish will surely win the award, when no award works that way."}]}}, {"title": "Say what the organisation gains", "plain": "Name four gains, all real even if the paper is rejected. The study forces you to build things the project's own audit lists as missing. It gives a tested answer for the next model change. It shows competence, and it opens the door to a later paper about the tool.", "restaurant": "To run the trial week, the restaurant has to start writing the chef's name next to every rating and keep a bill for every ingredient. Those habits stay useful whether or not the trial ends in an award. And next time a chef changes, the owner has evidence for Keep, Wipe or a discount instead of a guess.", "app": "In the application the gain is concrete: a model field next to every judgement (today the application does not record which model a judgement was made with), a log of tokens and cost, and a check that it has not silently fallen back to a stand-in model.", "table": null, "risks": {"caption": "The four gains, and what can stop each from arriving", "rows": [{"item": "An upgrade check: a model field on stored items, a token and cost log, and a check against a silent fall-back to a stand-in model", "what_can_go_wrong": "The pieces are built for the study's code only and never moved into the tool.", "when": "If the pilot ends and nobody carries the pieces across.", "what_it_costs": "The main practical gain is lost.", "how_to_notice": "The tool still shows judgements with no model name next to them.", "restaurant": "The owner learns to write the chef's name next to each rating in the trial book, but never in the real menu book."}, {"item": "A tested answer for the next model change: keep, wipe or discount, with evidence", "what_can_go_wrong": "The answer is measured on public tasks and may not fit the tool exactly, because the link is thin.", "when": "When the result is applied to the tool without a check.", "what_it_costs": "A wrong rule on the day of the next model change.", "how_to_notice": "Run the upgrade check on the tool itself at the next change.", "restaurant": "A rule learned in other restaurants may not fit this kitchen perfectly."}, {"item": "Standing: other hardware companies publish agent work on debug and failure analysis, and a paper at a machine-learning venue shows competence in the method", "what_can_go_wrong": "If the paper is not accepted, the standing gain is small.", "when": "After rejections.", "what_it_costs": "Nothing beyond the time already spent.", "how_to_notice": "The decision letters.", "restaurant": "An award mention helps the restaurant's name only if the jury says yes."}, {"item": "A door for the next paper: one accepted paper makes its authors eligible reviewers", "what_can_go_wrong": "Without an acceptance, the later paper about the tool itself does not get this help.", "when": "If no venue accepts this paper.", "what_it_costs": "The later paper starts with the lower chance.", "how_to_notice": "Whether any author has an accepted paper at a listed venue.", "restaurant": "A chef who has won once can sit on the jury, which helps the next entry."}]}}, {"title": "Prepare answers to the hardest questions", "plain": "The manager will ask hard questions. Each one has a short, honest answer. The original page lets you practise: read the question, answer aloud, then compare with the suggested answer, one question at a time (eight in all).", "restaurant": "Head office asks: why spend time on a trial when the new kitchen is not even open yet? The owner answers: this trial does not open the kitchen, and I will not pretend it does; it is small and we stop after one week if the numbers are bad.", "app": "The second question is about the application's design: in your application, code (not the model) decides where a case is stored, so the paper predicts your scores stay safe after a model change. That is why the link is called thin.", "table": {"caption": "The hardest questions, and what to answer", "columns": ["They ask", "You answer"], "rows": [["\"Nothing has run on real data yet. Why a paper?\"", "The paper moves none of the deliverables, and I will not present it as progress on them. What closes those gaps waits on a real drive and a real capture. This ask is small and has a gate after one week."], ["\"In our product the model does not file anything. Is this about us?\"", "Correct for our design. The paper measures the general case and predicts \"safe\" for ours. That is why I call the link thin."], ["\"These are not human verdicts.\"", "Correct. Scores come from a program's grade and the model's own marking. Verdicts from two or three engineers would be a separate, later study."], ["\"What if it is rejected?\"", "Rejection at ICML is the planning case. The paper then goes to NeurIPS and to TMLR, and the upgrade check exists either way."], ["\"What does it cost?\"", "About USD 700 in model calls, measured in the pilot. The real cost is about four weeks of my experiments and five weeks of writing, plus travel if it is presented in person."], ["\"What if someone publishes first?\"", "It is a real risk. Several groups are close, and decisions on related papers come on 16 December. The defences are a dated prediction file, speed, and a preprint (a public copy before review) on the day clearance arrives."], ["\"Why a machine-learning venue for a storage company?\"", "This paper shows the method. The tool's own story belongs at a test or design conference such as ITC (International Test Conference) or DAC (Design Automation Conference), as a second step."], ["\"What are the odds?\" (practice question 8)", "About one in four at ICML on the first try if one author already has a top-venue paper, about 40% for a top-ranked venue after two tries, and about 60 to 85% for some peer-reviewed paper by early 2028. Nobody can offer 95%."]]}, "risks": null}, {"title": "Ask for four decisions", "plain": "End by asking for four decisions and who makes each one. Only the employer can give them, and without them the paper cannot go out. They cover clearance, customer material, the author list and resources.", "restaurant": "Before the trial week the owner needs head office to say four things: may we publish the result under our name, is any guest's private order in our notebooks, which cooks are named on the entry, and how many hours and how much money we may spend.", "app": "The customer-material decision touches the application directly: the project's hand-over folder contains column names taken from a customer's machine, and none of it may enter the paper.", "table": null, "risks": {"caption": "The four decisions to ask for", "rows": [{"item": "Publication clearance for the paper, the experiment code and the use of the company's name, and whether an invention disclosure (a filing that protects an idea before it is made public) is wanted first", "what_can_go_wrong": "Clearance comes late or not at all.", "when": "If it is asked for late; it can take weeks.", "what_it_costs": "No preprint or submission is possible, so the 14 January 2027 deadline is missed.", "how_to_notice": "No written clearance by the end of the first week.", "restaurant": "Head office has not said the restaurant's name may appear on the award entry."}, {"item": "Confirmation about customer-derived material: the paper uses none, but the hand-over folder contains column names from a customer's machine; ask whether that repository is private", "what_can_go_wrong": "Customer-derived names leak into the paper or its public release.", "when": "When code or files are published from a repository that holds them.", "what_it_costs": "A breach of customer trust and possibly the paper itself.", "how_to_notice": "Search the release for any name from the hand-over folder before publishing.", "restaurant": "A guest's private order is copied into the recipe book that goes to the jury."}, {"item": "The author list: who is on it, each with real contribution, and whether one has a prior top-venue paper and can review for ICML between 24 February and 16 March 2027", "what_can_go_wrong": "The list closes on 14 January 2027 without an eligible reviewer, or with one who cannot review in time.", "when": "At the abstract deadline, and again during the review window.", "what_it_costs": "About half the first-try chance, or a desk rejection (rejected without review) if the reviewing author fails to review.", "how_to_notice": "Check every author's record and calendar before 14 January.", "restaurant": "The entry names no cook who has judged the award before, and the one who could judge is busy that month."}, {"item": "Resources: working hours, model keys and budget, and travel", "what_can_go_wrong": "The work starts without agreed hours or money and stops halfway.", "when": "When the pilot or the full study runs past what was approved.", "what_it_costs": "Lost runs that cannot be repeated once models retire.", "how_to_notice": "No written budget or hours before the first paid run.", "restaurant": "The trial week starts without a budget for ingredients."}]}}, {"title": "What not to say, and what to say instead", "plain": "Some sentences are tempting but untrue. Each has a true sentence to say instead. The original page lets you pick a tempting sentence and see its replacement.", "restaurant": "Do not tell head office that the dish will surely win the award, or that the trial improves tonight's dinner service. Say what is true: we aim for the award, the trial gives us a tested rule for the next chef change, and it uses no guest's private orders.", "app": "The last sentence matters for the application: the paper tells you whether the experience the agents built up (such as \"judged correct 9 of 10\" on a stored solution) can be trusted after a model change. It does not tell you whether a model meets your needs, or whether to fine-tune or train one.", "table": null, "risks": {"caption": "Tempting sentences, what goes wrong, and what to say instead", "rows": [{"item": "\"It will be accepted at ICML.\" Say instead: \"Our aim is ICML. Realistically we expect a peer-reviewed paper within about a year of submission, at roughly 60 to 85%.\"", "what_can_go_wrong": "Nobody can promise a venue, and published rates do not support 95%.", "when": "At the first rejection.", "what_it_costs": "Your credibility with the manager.", "how_to_notice": "Any promise of a venue is a warning sign.", "restaurant": "Promising the award before the jury has tasted the dish."}, {"item": "\"This advances our deliverables.\" Say instead: \"It does not move the sixteen deliverables. It gives us an upgrade check and a tested rule for the next model change.\"", "what_can_go_wrong": "The project's own coverage check shows none of the sixteen fully covered, so the claim is false.", "when": "When someone compares the claim with the coverage check.", "what_it_costs": "Trust in both the paper and the project.", "how_to_notice": "Read the project's coverage check before speaking.", "restaurant": "Saying the trial week improves tonight's service when it does not."}, {"item": "\"We measured human feedback.\" Say instead: \"The scores come from a program's grade and the model's own marking. Engineers' verdicts would be a later study.\"", "what_can_go_wrong": "The study has no human feedback, so the claim is false.", "when": "When a reviewer or manager reads the method.", "what_it_costs": "The study looks dishonest.", "how_to_notice": "Check where every score in the study comes from.", "restaurant": "Saying customers rated the plates when a machine graded them."}, {"item": "\"It uses our data.\" Say instead: \"It uses only public benchmarks, and no company or customer data.\"", "what_can_go_wrong": "The project files contain customer-derived column names; none may enter the paper.", "when": "When the paper or code is released.", "what_it_costs": "A leak of customer-derived material.", "how_to_notice": "Check the release for any project file.", "restaurant": "Saying the trial used our regular guests' orders when it must not."}, {"item": "\"It decides whether to upgrade, fine-tune or train.\" Say instead: \"When we change models, it tells us whether the experience our agents built up can be trusted, and what it costs to re-earn it.\"", "what_can_go_wrong": "The paper does not test whether a model meets our needs, or whether to fine-tune or train.", "when": "When someone uses the paper to choose a model.", "what_it_costs": "A model decision made on evidence that does not cover it.", "how_to_notice": "Ask whether the question is about old scores or about the model itself.", "restaurant": "The trial says whether old ratings still hold under the new chef, not whether to hire him."}]}}]}, {"chapter": "Before you start", "summary": "Ten things must be finished in the first week, before any paid experiment runs. Each has a reason: without it the paper may not be allowed, may break a submission rule, or may not be trusted by reviewers.", "steps": [{"title": "Get permission and keep company data out", "plain": "First, get written permission to publish from your employer. Second, confirm in writing that the paper uses public benchmarks only. The original page shows the ten items as a checklist whose ticks are saved in your browser only.", "restaurant": "Before entering the award, the owner gets a signed note from head office saying the restaurant may publish its result. He also writes down that only public tasting dishes are used, and no guest's private order.", "app": "The project's hand-over files contain column names taken from a customer's machine. None of that may enter the paper or its release.", "table": null, "risks": {"caption": "Permission and data items", "rows": [{"item": "Written publication clearance from your employer", "what_can_go_wrong": "Clearance takes weeks and is not ready in time.", "when": "If it is asked for late.", "what_it_costs": "No preprint or submission is possible without it.", "how_to_notice": "No written clearance at the end of the first week.", "restaurant": "The entry form is ready but head office has not signed it."}, {"item": "Confirm in writing that the paper uses public benchmarks only", "what_can_go_wrong": "Customer-derived column names from the hand-over files enter the paper or its release.", "when": "When files are copied from the project into the paper's code.", "what_it_costs": "A leak of customer-derived material.", "how_to_notice": "Search the paper and its code for any name from the hand-over files.", "restaurant": "A guest's private order slips into the recipe book sent to the jury."}]}}, {"title": "Build the author team", "plain": "Settle the author list early, with real work from each author. Check whether each author can serve as a reviewer, and create a correct OpenReview profile (OpenReview is the website where ICML papers are submitted and reviewed) for each one. Team make-up is the largest measured gap in acceptance.", "restaurant": "The award entry must name its cooks by a fixed date. A team that includes a cook who has won before gets the usual chance; that cook must also sit on the jury for other entries during the judging weeks, or the entry can be thrown out.", "app": "Not applicable: this is about the people on the paper, not about the application.", "table": null, "risks": {"caption": "Author items", "rows": [{"item": "Settle the author list, with real contribution from each author", "what_can_go_wrong": "The list is not settled when it closes on 14 January 2027.", "when": "At the abstract deadline.", "what_it_costs": "Team make-up is the largest measured gap in acceptance, so a weak list lowers the chance most.", "how_to_notice": "No agreed list by early January.", "restaurant": "The cooks' names are still undecided on the day the entry closes."}, {"item": "Check every author's eligibility as a reviewer: one accepted paper at ICML, NeurIPS, ICLR, TMLR, AAAI, IJCAI, KDD, the ACL family or a similar listed venue (workshop and industry-track papers do not count)", "what_can_go_wrong": "No author is eligible, so the lower rate and the one-paper limit apply; or the eligible author does not review between 24 February and 16 March 2027.", "when": "At submission, and during the review window.", "what_it_costs": "About half the first-try chance, or a desk rejection.", "how_to_notice": "List each author's accepted papers and their venues. (ICLR is the International Conference on Learning Representations; AAAI, IJCAI, KDD and ACL are other major artificial intelligence, data mining and language conferences.)", "restaurant": "No cook on the team has won a recognised award, or the one who has skips jury duty."}, {"item": "Create a correct OpenReview profile for every author", "what_can_go_wrong": "Approval of a profile is slow.", "when": "When an author has no institutional email address; approval can take up to two weeks.", "what_it_costs": "An author cannot be added in time.", "how_to_notice": "A profile still pending a few days after it was created.", "restaurant": "A cook's registration with the award office takes two weeks to be approved."}]}}, {"title": "Read the four unread close papers", "plain": "Four papers close to this one have not been read in full: Xia et al. (arXiv 2511.07800), HEIRS, \"When Can a Skill Library Trust Its Execution Records?\" and \"Beyond Semantic Relevance\". Read them in a normal browser. arXiv is a free public website for research papers.", "restaurant": "Before telling the jury that no food magazine has ever tested whether ratings carry over to a new chef, the owner must read the last four magazine articles he has only skimmed. One of them might already have done the test.", "app": "Not applicable: this is about other published research, not about the application.", "table": null, "risks": {"caption": "The reading item", "rows": [{"item": "Read Xia et al., HEIRS, \"When Can a Skill Library Trust Its Execution Records?\" and \"Beyond Semantic Relevance\"", "what_can_go_wrong": "One of them already compares keep, wipe and discount for numeric scores.", "when": "If it is found only after the experiments, or by a reviewer.", "what_it_costs": "The paper's claim must narrow, and a reviewer may call it not new.", "how_to_notice": "Read each paper's method and results for a keep, wipe or discount comparison.", "restaurant": "A magazine already ran the rating test, and the jury points it out."}]}}, {"title": "Open accounts, confirm models, set the budget", "plain": "Open API accounts (an API, application programming interface, is how a program calls a rented model) with Anthropic, OpenAI and an OpenAI-compatible host for the Qwen pair, plus a key for an embedding service (one that turns text into numbers so similar texts can be found). Confirm each model on the vendor's own page. Set a budget of about USD 700, with headroom to USD 1,400.", "restaurant": "The owner signs contracts with three chef agencies and checks on each agency's own website that the chefs named in his notes still work there, at the stated price. He sets aside money for the trial, with room to spend twice that if ingredients cost more than guessed.", "app": "The application already rents its model the same way (today Claude Sonnet; on the laptop maybe DeepSeek). The same habit applies: confirm the model name and price on the vendor's own page.", "table": null, "risks": {"caption": "Account and budget items", "rows": [{"item": "Open API accounts and confirm each model on the vendor's own page", "what_can_go_wrong": "A model name, price or retirement date in the plan is wrong, because they come from earlier notes and were not re-checked.", "when": "On the first call, or later when a model retires early.", "what_it_costs": "Wrong cost estimates or runs that cannot be finished.", "how_to_notice": "Compare each name, price and date in the plan with the vendor's page on day one.", "restaurant": "The chef named in the notes has already left the agency."}, {"item": "Set a budget of about USD 700, with headroom to USD 1,400", "what_can_go_wrong": "The real cost is higher, because the estimate rests on assumed token counts (a token is a small piece of text that providers charge by).", "when": "The pilot measures the real cost on about day 5.", "what_it_costs": "Money beyond the approved budget, or a stop halfway.", "how_to_notice": "Compare the measured cost on about day 5 with the estimate.", "restaurant": "Ingredients cost more than the owner guessed."}]}}, {"title": "Write a dated prediction file before the first paid run", "plain": "Before any paid run, write a file with today's date. It holds the three predictions, the four primary comparisons, the margins and the go or no-go rule. The margins are 5 points for a difference, and 3 points either way for \"no drop\". Reviewers trust results that were predicted in advance.", "restaurant": "Before Chef Suresh cooks a single trial plate, the owner writes down and dates his guesses: which dishes will keep their ratings, how big a change counts as real, and what result would end the trial. Nobody can later say he changed his guesses to fit the results.", "app": "Not applicable: the prediction file belongs to the paper. The habit could serve a later model change in the application, but nothing in the plan asks for that.", "table": null, "risks": {"caption": "The prediction-file item", "rows": [{"item": "A dated prediction file with the three predictions, the four primary comparisons, the margins (5 points for a difference, 3 points either way for \"no drop\") and the go or no-go rule", "what_can_go_wrong": "The file is written after some results are seen, or is missing.", "when": "If paid runs start before it exists.", "what_it_costs": "Reviewers cannot trust that the predictions came before the results.", "how_to_notice": "The file's date is later than the first paid call in the log.", "restaurant": "The owner writes down his guesses after tasting the plates."}]}}, {"title": "Install Docker and a Python 3.10 environment", "plain": "Install Docker (a tool that runs programs in sealed boxes) and a Python 3.10 environment. The released-code leg of the study, which runs another group's published code (MemRL), needs both.", "restaurant": "To cook another restaurant's published recipe exactly, the owner needs the same kind of oven they used. He installs it in the first week, not on the day the recipe is needed.", "app": "Not applicable: this is computer setup for the paper's experiments.", "table": null, "risks": {"caption": "The setup item", "rows": [{"item": "Install Docker and a Python 3.10 environment", "what_can_go_wrong": "The released-code leg cannot run.", "when": "When the MemRL leg is set up, planned for the week of 23 to 29 November.", "what_it_costs": "The second ground of the study is late or cut.", "how_to_notice": "The MemRL setup fails at its Docker or Python step.", "restaurant": "The borrowed recipe needs an oven the kitchen does not have."}]}}]}, {"chapter": "Prepare the data", "summary": "Eight steps get the public data, the models and the score code ready for the experiment. Every step rests on facts checked against the repositories and dataset files on 15 November 2026, but the sequence as a whole has not been run end to end, so expect small fixes.", "steps": [{"title": "Get the two main streams and the BIRD databases (steps 1 and 2)", "plain": "Download StreamBench, a public collection of tasks given one after another (a \"stream\"), and pin it to one saved version of its code. Use two of its streams, test splits only: DDXPlus (medical diagnosis, graded by matching the label) and BIRD (turning questions into SQL, Structured Query Language, the language for asking databases; graded by running the query). BIRD's databases are a separate download. Each task is one model call graded by a program, so each episode is cheap.", "restaurant": "The restaurant uses two public tasting tests that any kitchen can cook: 1,764 orders of one kind and 1,534 of another. A machine grades each plate, not a person, so each trial plate is cheap. The second test also needs a box of ingredients that comes separately.", "app": "Not applicable: these are public benchmarks. No drive captures, recordings or customer files from the application are used.", "table": {"caption": "What to get, and what to check (facts as checked on 15 November 2026)", "columns": ["What", "Where from", "Check"], "rows": [["StreamBench code", "github.com/stream-bench/stream-bench, checked out at commit cf72f26 (a commit is one saved version of the code)", "Pin that commit."], ["DDXPlus stream", "Hugging Face (a public website for datasets), appier-ai-research/StreamBench, \"ddxplus\", test split", "1,764 tasks. Record the hash (a fingerprint) of the parquet data file."], ["BIRD stream", "Hugging Face, appier-ai-research/StreamBench, \"bird\", test split", "1,534 tasks. Record the hash of the parquet data file."], ["BIRD databases", "download_text2sql_data.py, edited to run only the BIRD download; about 330 MiB compressed (MiB: mebibyte, about one million bytes)", "A SQLite database file (a database kept in one file) exists for every database named in the stream. Record the zip's date and hash."]]}, "risks": {"caption": "Rules in these two steps", "rows": [{"item": "Use only the test splits, and assert 1,764 DDXPlus and 1,534 BIRD tasks", "what_can_go_wrong": "A different split or version is loaded and the counts do not match.", "when": "When the dataset loads.", "what_it_costs": "Results that cannot be compared or repeated.", "how_to_notice": "The count check fails.", "restaurant": "The kitchen cooks from the wrong edition of the tasting test."}, {"item": "Edit download_text2sql_data.py so it runs only the BIRD download", "what_can_go_wrong": "The script also downloads two other datasets you do not need.", "when": "If it is run unedited.", "what_it_costs": "Time and disk space.", "how_to_notice": "Extra dataset folders appear.", "restaurant": "The supplier sends three boxes when only one was ordered."}, {"item": "Delete the BIRD data folder left by a failed attempt before running again", "what_can_go_wrong": "The script silently keeps a partial unzip.", "when": "After an interrupted or failed download.", "what_it_costs": "Some tasks cannot be graded.", "how_to_notice": "A database file is missing for some database named in the stream.", "restaurant": "A half-unpacked box of ingredients is taken as complete."}, {"item": "Record the zip's date and hash", "what_can_go_wrong": "The hosted copy is dated June 2024 and may differ slightly from the one behind the original paper's numbers.", "when": "When your numbers are compared with the original paper's.", "what_it_costs": "Small differences that cannot be explained.", "how_to_notice": "Compare the recorded date and hash in the paper's notes.", "restaurant": "The ingredient box is a newer batch than the one the original recipe used."}]}}, {"title": "Freeze your own stream order and splits (step 3)", "plain": "Shuffle each stream with a seed (the starting number for the shuffle) that you record, and save the order to a file. Cut it into three parts that share no task: about 600 tasks to earn scores, 200 probe tasks to judge the scores, and 300 final test tasks. Make three such orders.", "restaurant": "Of all the trial orders, about 600 plates are used to earn the ratings, 200 other plates are used to check whether the ratings are right, and 300 more are kept for the final verdict. A customer who helped earn a rating is never the one who checks it.", "app": "The same principle holds in the application: if you later check whether \"judged correct 9 of 10\" still holds under a new model, check it on cases that did not earn the rating.", "table": {"caption": "The three parts of each stream order", "columns": ["Part", "Tasks", "Job"], "rows": [["Build", "About 600", "Tasks that earn scores"], ["Probe", "200", "Tasks that judge scores"], ["Test", "300", "Tasks for final success"], ["Not used", "The rest (of 1,764 DDXPlus or 1,534 BIRD tasks)", "None"]]}, "risks": {"caption": "Rules for the order and the splits", "rows": [{"item": "Shuffle with your own recorded seed; do not rely on the repository's seed: 42", "what_can_go_wrong": "The repository sets seed: 42 but does not say what it controls, so the order cannot be rebuilt.", "when": "When someone tries to repeat the study.", "what_it_costs": "Results nobody can reproduce.", "how_to_notice": "Two runs give different orders.", "restaurant": "The order of tasting plates is left to a setting nobody understands."}, {"item": "The three parts share no task", "what_can_go_wrong": "A task that helped earn a score is also used to judge it.", "when": "If the split files overlap.", "what_it_costs": "Scores look better than they are, and reviewers would reject the result.", "how_to_notice": "Check that no task appears in two split files.", "restaurant": "The same customer earns the rating and then checks it."}]}}, {"title": "Connect current models (step 4)", "plain": "The models named in StreamBench's settings files are retired, so every settings file needs a model edit. You need six models from three makers through one harness (one shared test program). An OpenAI-compatible host can be reached through the CUSTOM_API_URL setting. Register your memory agent as a subclass of Agent in stream_bench/agents/base.py and add it to stream_bench/agents/__init__.py.", "restaurant": "The test kitchen's staff list names chefs who no longer work anywhere. The owner replaces them with six current chefs from three agencies, all cooking in the same kitchen with the same tools so the plates can be compared.", "app": "The application reaches its rented model in a similar way (today Claude Sonnet). The paper does this for six models at once.", "table": null, "risks": {"caption": "Points to watch when connecting models", "rows": [{"item": "Edit every settings file to name a current model", "what_can_go_wrong": "A settings file still names a retired model.", "when": "On the first run.", "what_it_costs": "Failed calls and lost time.", "how_to_notice": "Calls fail with an unknown or retired model.", "restaurant": "The staff list still names a chef who has left."}, {"item": "Expect to patch the OpenAI backend, which hard-codes logprobs=True (a request for the model's probability for each word)", "what_can_go_wrong": "A model or host that does not accept that request may fail.", "when": "When a model other than the expected one is used through that backend.", "what_it_costs": "Time spent finding the fault.", "how_to_notice": "Errors that mention logprobs.", "restaurant": "The kitchen's order slip always asks for something the new chef's agency does not provide."}]}}, {"title": "Write the score layer and the swap-day arms (step 5)", "plain": "None of the four public codebases has a reset or discount function, so write a thin layer of about 300 lines. It has two score rules: a MemRL-style value update (one number per item, called a Q-value) and ACE-style helpful and harmful counters (ACE is another published memory method that keeps two counts per item). Then write the arms, the rules for the day of the model change, yourself: keep, wipe, fixed discount, calibrated discount. This is the core of the study.", "restaurant": "No restaurant software has a button to reset or discount a rating, so the owner writes his own. It supports the four choices on Chef Suresh's first day: Keep \"9 of 10\", Wipe it, show it at a Fixed discount (0.90 becomes 0.70), or Calibrated (16 plates first; with trust 0.10, 0.90 becomes 0.54). Those numbers are made up to show the idea.", "app": "Today the application does Keep: when the model changes, a stored solution keeps its \"judged correct 9 of 10\", and the application does not record which model the judgements were made with. The four arms are the choices it could make instead.", "table": null, "risks": {"caption": "The arms and the definitions they need", "rows": [{"item": "Keep: old scores unchanged", "what_can_go_wrong": "The old scores rank items wrongly for the new model.", "when": "If the new model uses the items differently.", "what_it_costs": "Weak items are shown first.", "how_to_notice": "Retained validity (how often the higher-scored item really does better) falls after the swap.", "restaurant": "The menu still says \"9 of 10\" though Suresh cooks the biryani differently."}, {"item": "Wipe: reset to the rule's starting value (0.5 in MemRL's configuration for these tasks), not zero", "what_can_go_wrong": "Resetting to zero instead changes the ranking and makes the arm wrong.", "when": "When the wipe is coded.", "what_it_costs": "The wipe arm measures the wrong thing.", "how_to_notice": "Wiped items show 0 instead of 0.5.", "restaurant": "Wiping the rating means \"no opinion yet\", not \"terrible\"."}, {"item": "Fixed discount: trust the old score by the same weight at every change", "what_can_go_wrong": "One fixed weight may be too much for some changes and too little for others.", "when": "When changes differ in how much the new model differs.", "what_it_costs": "Some ranking value lost either way.", "how_to_notice": "Compare it with keep and wipe for each swap pair.", "restaurant": "\"Half believable\" for every new chef, whether he cooks the same or very differently."}, {"item": "Calibrated discount: trust set from a few fresh checks with the new model", "what_can_go_wrong": "Too few fresh checks set the trust by chance.", "when": "With the smallest numbers of fresh checks.", "what_it_costs": "The paid fresh checks, and a possibly wrong trust weight.", "how_to_notice": "Compare its result with the re-scored ceiling.", "restaurant": "Trust set from 16 plates, which might be a lucky or unlucky batch."}, {"item": "Define how ACE's counters rank items (for example helpful minus harmful) and put that definition in the prediction file", "what_can_go_wrong": "ACE's counters do not rank retrieval in ACE's own code, so an unstated choice looks like it was picked after seeing results.", "when": "If the definition is chosen after the runs.", "what_it_costs": "Reviewers' trust in the counter results.", "how_to_notice": "The definition is missing from the dated prediction file.", "restaurant": "Deciding after the trial whether \"good minus bad ratings\" is how dishes are ranked."}]}}, {"title": "Set up the released-code leg: MemRL (step 6)", "plain": "Also run another group's released code, MemRL, so nobody can say the effect comes only from your own layer. Use its operating-system tasks (500 tasks: 350 train, 150 validation); its database tasks are near ceiling for current models, so they cannot show an effect. To build an arm, copy the saved snapshot, edit q_value in textual_memory.json, then delete the whole local_cache folder. Each score is stored in three places and the caches override file edits.", "restaurant": "The owner also cooks another restaurant's published recipe, so nobody can say the result comes from his own kitchen's quirks. That restaurant keeps each rating in three places: a board in the kitchen, the waiter's notebook and the printed menu. The kitchen reads the board first, so changing only the menu changes nothing.", "app": "Not applicable directly: this is another group's code. The lesson carries over: if a rating is ever kept in more than one place, a reset must reach every copy.", "table": {"caption": "Setup (repository facts as of 15 November 2026)", "columns": ["What", "How"], "rows": [["Get the code", "Clone github.com/MemTensor/MemRL and check out commit c1b322c."], ["Python", "Create a conda environment (conda makes separate Python setups) with Python 3.10 and install requirements.txt."], ["Docker", "Start the stock mysql image and build the local-os/default image."], ["Settings", "Copy configs/rl_llb
