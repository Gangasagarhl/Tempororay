nt about limitations."]]}, "risks": null}, {"title": "Rules of the ladder", "plain": "The paper can be under review at only one venue at a time, so each step costs three to six months. Conferences come before TMLR, because TMLR does not take expanded versions of conference papers. Review is noisy: in 2021 NeurIPS gave the same papers to two committees, and they disagreed on 23% of them.", "restaurant": "A dish can be entered in only one award at a time, and each award takes months. Enter the famous awards first, because the food guide will not review a dish that already won elsewhere. Two juries tasting the same dishes disagreed on almost a quarter, so one rejection does not mean the dish is bad.", "app": "Not applicable: these are publishing rules.", "table": null, "risks": {"caption": "The four rules and what breaking them costs", "rows": [{"item": "One venue at a time", "what_can_go_wrong": "The paper is sent to two venues at once.", "when": "When a new deadline opens while the paper is still under review.", "what_it_costs": "Every venue bans parallel review, so the paper can be rejected by both.", "how_to_notice": "Two open submissions of the same paper at the same time.", "restaurant": "The same dish is entered in two awards at once and is thrown out of both."}, {"item": "Conferences before TMLR", "what_can_go_wrong": "The paper goes to TMLR first, then to a conference.", "when": "If the order of the ladder is changed.", "what_it_costs": "TMLR does not take expanded versions of conference papers, so the order cannot be reversed later.", "how_to_notice": "A plan that lists TMLR before ICML or NeurIPS.", "restaurant": "The food guide will not list a dish that is just a bigger version of an award winner."}, {"item": "Preprint and workshop papers", "what_can_go_wrong": "A workshop paper with published proceedings is used for the same work.", "when": "If a workshop is chosen to show early results.", "what_it_costs": "It would block every later venue.", "how_to_notice": "The workshop's call says its papers are published in proceedings.", "restaurant": "Showing the dish at a small fair is fine, but a fair that prints it in its own book stops later award entries."}, {"item": "Review is noisy", "what_can_go_wrong": "A rejection is read as proof the paper is weak, and the attempt stops.", "when": "After the first rejection.", "what_it_costs": "A paper that could pass at the next venue is given up; a second submission is the normal path.", "how_to_notice": "A decision to stop after one rejection, against the ladder's rule.", "restaurant": "The restaurant gives up after one jury says no, though another jury would disagree almost one time in four."}]}}]}, {"chapter": "Expected outcomes", "summary": "Nobody knows yet what the experiment will show, and that uncertainty is what makes it publishable; each of five possible result patterns has its own headline and its own venue. If none of the stronger results comes out, a fallback ladder leads from ICML 2027 to the NeurIPS 2027 evaluations track and then to the journal TMLR.", "steps": [{"title": "Every result has a home", "plain": "The experiment has not been run, so its result is unknown. That is what makes it worth publishing: the answer is not obvious. The page lists five possible patterns. Each gets its own headline and the venue it would go to.", "restaurant": "The restaurant does not know yet whether Ravi's ratings will survive Suresh. Whatever the 16 test plates show across the 12 restaurants, there is a story to tell and a place to tell it.", "app": "Each pattern would tell the owner something about the next model change: whether Keep, which the application does today, is safe or needs a discount. For the application's design, where code and not the model decides where a case is stored, the original page predicts the scores stay safe.", "table": {"caption": "The five result patterns, as the original gives them", "columns": ["Result", "Headline", "Where it goes"], "rows": [["Large drop in score validity", "Carried scores mislead after a swap; here is the rule that fixes it", "ICML, type \"General\""], ["Drop in some pairs, explained", "Which swaps break stored scores, and why", "ICML, type \"Datasets, Evaluations and Benchmarks\""], ["Small drop", "Scores mostly survive; a few fresh checks are enough", "TMLR first"], ["No drop, shown by equivalence", "Keeping scores is safe under these conditions", "TMLR, or ICML \"Negative Results\" only if very tight"], ["Scores weak even at home", "Greedy retrieval leaves stored scores uninformative", "A different paper, for TMLR or NeurIPS 2027"]]}, "risks": {"caption": "Each result: what it means and what it costs", "rows": [{"item": "Large drop in score validity -> ICML \"General\"", "what_can_go_wrong": "The rule that \"fixes it\" does not recover enough, so the headline is only half true.", "when": "When the calibrated arm is scored, before the freeze on 15 December 2026.", "what_it_costs": "The headline must shrink, and the paper may fit a lower bar.", "how_to_notice": "The calibrated arm is far below the Re-scored ceiling.", "restaurant": "Ravi's ratings clearly mislead under Suresh, but 16 test plates do not repair them."}, {"item": "Drop in some pairs, explained -> ICML \"Datasets, Evaluations and Benchmarks\"", "what_can_go_wrong": "The drops appear in some pairs but no registered prediction explains them.", "when": "When the three prediction analyses run, 7 to 15 December 2026.", "what_it_costs": "Without the \"why\", the result falls toward the minimum bar.", "how_to_notice": "None of the three predictions holds across the twelve pairs.", "restaurant": "Ratings broke in some restaurants, but the restaurant cannot say which kind of chef change caused it."}, {"item": "Small drop -> TMLR first", "what_can_go_wrong": "The drop is too small to tell apart from the noise floor.", "when": "When per-pair results are compared with the self-swap control.", "what_it_costs": "The paper goes to TMLR first instead of ICML.", "how_to_notice": "The drop for most pairs is inside the self-swap range.", "restaurant": "Ratings slip only a little under Suresh, about as much as they vary on Ravi's own good and bad days."}, {"item": "No drop, shown by equivalence -> TMLR, or ICML \"Negative Results\" if very tight", "what_can_go_wrong": "The \"no drop\" is not tight enough to prove; a failed difference test alone is not evidence of no drop.", "when": "When the equivalence test with the 3-point margin is run.", "what_it_costs": "The paper cannot claim keeping is safe, only that no difference was found.", "how_to_notice": "The error bars are wider than the 3-point margin.", "restaurant": "The restaurant wants to say \"the ratings are just as good under Suresh\" but tasted too few plates to be sure."}, {"item": "Scores weak even at home -> a different paper", "what_can_go_wrong": "The scores mean little even with the model that earned them.", "when": "In the pilot before 22 November 2026, or in the full home-validity table.", "what_it_costs": "This paper cannot be written; a different paper about weak scores replaces it.", "how_to_notice": "Home concordance below the 0.60 gate.", "restaurant": "Even under Ravi, the 9 of 10 dishes were not really better, so there is nothing to carry over."}]}}, {"title": "The two results that aim at ICML", "plain": "A large drop gives the strongest story: old scores mislead after a swap, and the paper offers the rule that fixes it; it would go to ICML as a \"General\" paper. A drop in only some pairs, with a reason, would go to ICML's \"Datasets, Evaluations and Benchmarks\" type, which covers auditing and needs no new algorithm. One example the page gives for this pattern: same-family upgrades keep their value, while switches to another maker do not.", "restaurant": "If Ravi's ratings clearly mislead under every new chef, and 16 test plates repair them, that is a story for the famous award. If they mislead only when the new chef comes from a different cooking school, and the restaurant can say why, that also fits the award, in its testing category.", "app": "If either pattern appears, Keep would be risky at least for some changes, such as a change to a model from another maker (Claude Sonnet to DeepSeek on the laptop). The owner would then want to record which model each \"judged correct\" count came from, which the application does not do today.", "table": null, "risks": null}, {"title": "The three results that go elsewhere", "plain": "A small drop means scores mostly survive and a few fresh checks are enough; this goes to TMLR first. No drop, shown by an equivalence test within 3 points, means keeping scores is safe under the tested conditions; this goes to TMLR, or to ICML's \"Negative Results\" only if the result is very tight. If the scores were near chance even with the old model, there is nothing to carry over, and the work becomes a different paper for TMLR or NeurIPS 2027 about why greedy retrieval (always showing the current top-scored item) leaves scores uninformative.", "restaurant": "If Ravi's ratings hold up almost as well under Suresh, the news is \"keep the menu, cook a few test plates\", which suits a respected food guide. If the ratings never meant anything even under Ravi, the story changes: it is about why the menu always pushed the same dishes, so customers never rated the others.", "app": "A small or no-drop result would support what the application does today (Keep), as the original page predicts for its design. A weak-at-home result would be a warning that the \"judged correct\" counts may need more varied trials before they mean much.", "table": null, "risks": null}, {"title": "Try it: how each result would look", "plain": "The page shows a grid of tiles, one per model switch. Each tile shows retained validity: 1.00 means the old scores rank as well as before, 0 means no better than a coin toss. Buttons switch between the five patterns. The values are made up to show the patterns, and the paper's first figure would show the real values for every switch.", "restaurant": "Picture a wall with 12 cards, one per restaurant that changed chef. Each card shows how well the old ratings still pick the better dish under the new chef: 1.00 is as well as under the old chef, 0 is a coin toss. The wall looks different for each kind of result.", "app": "Not applicable: the tiles show the paper's model switches on public benchmarks, not the application's data.", "table": {"caption": "The headline shown for each button (from the original)", "columns": ["Button", "Headline", "Where"], "rows": [["Large drop", "Carried scores mislead after a swap, and here is the rule that fixes it.", "ICML, type \"General\""], ["Drop in some pairs", "Which swaps break stored scores, and why. Same-family upgrades keep their value; switches to another maker do not.", "ICML, type \"Datasets, Evaluations and Benchmarks\""], ["Small drop", "Scores mostly survive, and a few fresh checks are enough.", "TMLR first"], ["No drop", "Keeping scores is safe under these conditions, shown by an equivalence test.", "TMLR, or ICML \"Negative Results\" only if the result is very tight"], ["Weak at home", "The scores were near chance even with the old model, so there is nothing to carry over.", "A different paper, for TMLR or NeurIPS 2027"]]}, "risks": null}, {"title": "The fallback ladder", "plain": "ICML 2027 comes first. Next is the NeurIPS 2027 evaluations track; its dates are not posted, but by the 2026 pattern it is about May, and its 2026 call welcomed negative results, critical analyses and audits. Prepare that version in April in any case, because its deadline may fall days after the ICML decision. TMLR is the last step and is always open.", "restaurant": "Enter the most famous award first. If it says no, enter the second famous award, which last year asked for honest testing reports, and have that entry ready before the first jury answers. The respected food guide takes entries all year and is the last stop.", "app": "Not applicable: this is the order of venues for the paper.", "table": {"caption": "The ladder, in order", "columns": ["Step", "Venue", "Timing from the original"], "rows": [["1", "ICML 2027", "Abstract 14 January 2027, paper 22 January 2027; final decisions 3 May 2027"], ["2", "NeurIPS 2027 evaluations track", "Dates not posted; about May by the 2026 pattern; prepare the version in April"], ["3", "TMLR", "Always open"]]}, "risks": {"caption": "Risks on the fallback ladder", "rows": [{"item": "Go from ICML 2027 to the NeurIPS 2027 evaluations track", "what_can_go_wrong": "The NeurIPS deadline falls days after the ICML decision and the new version is not ready.", "when": "Around the ICML final decisions on 3 May 2027, if NeurIPS keeps its 2026 pattern of about May.", "what_it_costs": "A whole step on the ladder is lost, adding months before TMLR.", "how_to_notice": "No NeurIPS version exists by the end of April 2027.", "restaurant": "The first award says no, and the entry for the second award is due a few days later but was never prepared."}, {"item": "Rely on NeurIPS dates from the 2026 pattern", "what_can_go_wrong": "The 2027 dates differ from the 2026 pattern.", "when": "When NeurIPS posts its 2027 dates.", "what_it_costs": "The April preparation may be too early or too late.", "how_to_notice": "The posted NeurIPS 2027 call shows different dates.", "restaurant": "The second award moves its entry day, and the restaurant planned around last year's."}, {"item": "TMLR as the last step", "what_can_go_wrong": "TMLR also rejects the paper.", "when": "After both conference tries, by about January 2028.", "what_it_costs": "The plan's rule ends with an internal report.", "how_to_notice": "A TMLR rejection.", "restaurant": "The food guide declines the dish too, and the test becomes an internal note for the restaurant's staff."}]}}]}, {"chapter": "How to present it", "summary": "This section says how to write and show the paper so reviewers believe it: an accurate title, a six-sentence abstract, a first page with the strongest example and the limits, one main figure, one main table and a full release. It also lists what must not be claimed as new, and explains why the abstract, introduction and first figure get their own week.", "steps": [{"title": "A title that names what was measured", "plain": "Say \"scores\", not \"memory\", because the nearest preprint (a paper posted publicly before review) is already titled \"Does Your Agent's Memory Survive a Model Upgrade?\". Never say \"human\": every score in the study comes from a program's grade or the model's own marking. Name the measured quantity and do not overclaim. A reviewer of one accepted measurement paper called an overclaiming title its \"most serious weakness\".", "restaurant": "A food magazine already ran the headline \"Do the recipes survive a new chef?\". Our write-up must ask \"Do the ratings survive a new chef?\", because that is the part nobody checked. It must not say \"customers rated\" when the plates were rated by a tasting machine or by the chef himself. A plain headline is fine; a headline that promises more than the kitchen tested is not.", "app": "In the application the ratings are the admin's judgements from the four buttons, and those are human. The paper studies none of them, so it cannot say anything about human verdicts; engineers' verdicts would be a separate, later study.", "table": null, "risks": {"caption": "Title rules and what breaks if they are ignored", "rows": [{"item": "Say \"scores\", not \"memory\"", "what_can_go_wrong": "The title reads like the nearest preprint, so the paper looks like a copy.", "when": "When a reviewer or the area chair (the senior reviewer who screens papers first) compares titles.", "what_it_costs": "The paper starts with a doubt about originality, one of the four things ICML reviewers score.", "how_to_notice": "A review says the work repeats \"Does Your Agent's Memory Survive a Model Upgrade?\".", "restaurant": "Our headline sounds like the magazine's recipe story, so the jury thinks we cooked the same dish."}, {"item": "Never say \"human\"", "what_can_go_wrong": "The title claims human ratings that the study does not have.", "when": "As soon as a reviewer reads the methods and sees program grades and self-marking.", "what_it_costs": "Trust in the whole paper drops, because the first promise was false.", "how_to_notice": "A review points out that no person rated anything.", "restaurant": "We wrote \"customers loved it\" when only a tasting machine had tried the plates."}, {"item": "Do not overclaim", "what_can_go_wrong": "The title promises a general answer that the measured pairs do not support.", "when": "When the results hold only for some swaps, or only on the two benchmarks.", "what_it_costs": "A reviewer of one accepted paper called exactly this its \"most serious weakness\".", "how_to_notice": "Reviews quote the title back with the word \"overclaims\".", "restaurant": "The headline says \"ratings never survive a chef change\" after testing 12 restaurants of one kind."}]}}, {"title": "An abstract in six sentences", "plain": "The abstract has six sentences in a fixed order: the forced model change, the belief nobody tested, what was measured and at what scale, the headline number by kind of swap, the rule for practitioners, and the release. The page gives an example for each. Numbers in square brackets are blanks filled in from the results, and sentence 4 changes with the result pattern.", "restaurant": "Six lines to the jury: restaurants must change chef when the chef leaves; everyone believes the old ratings carry over, but nobody checked; we checked in 12 restaurants; old ratings kept [X]% of their value when the new chef came from the same cooking school, [Y]% when from another school; tasting [k] plates first recovers most of the benefit; we hand over every tasting sheet.", "app": "Not applicable: the abstract describes public benchmarks only, and no data from the application enters the paper.", "table": {"caption": "The six sentences, with the original's examples (bracketed numbers are filled in from the results)", "columns": ["#", "What goes here", "Example"], "rows": [["1. Forced change", "Why the problem exists", "Teams that build agents on rented language models must replace those models on the vendor's schedule, often within about a year of release."], ["2. Untested belief", "The belief nobody has tested", "Many such agents store a usefulness score on each memory item, and recent work suggests these scores carry over to a new model, but no study has checked whether they still rank items correctly."], ["3. What we measured", "What you did, with its scale", "We measure this across 12 ordered swaps among six models from three makers, on two public benchmarks and one released codebase, holding the memory content fixed."], ["4. Headline", "The main number, by kind of swap", "Old scores keep [X]% of their ranking value within a model family but only [Y]% across makers."], ["5. The rule", "What practitioners should do", "A discount set from [k] fresh checks recovers [Z]% of the benefit of re-scoring at [W]% of its cost."], ["6. Release", "What others can reuse", "We release code, prompts, raw answers and all probe tables."]]}, "risks": null}, {"title": "The first page: one clear example, then the limits", "plain": "Open with the CHIME cell and the MemRL sentence. CHIME is a September 2026 preprint in which memory moved from Qwen to DeepSeek added only 0.78 points on the tau2-Bench task, while DeepSeek's own memory added 6.24. MemRL (accepted at NeurIPS 2026, the Conference on Neural Information Processing Systems) wrote that \"the learned utility over memories generalizes beyond any single model's inherent strength\" without ever removing the scores to check. Then state the limits plainly: program-graded and model-assigned scores, one item shown at a time, single-call tasks.", "restaurant": "Start with the one restaurant where the new chef gained almost nothing from the old ratings (under 1 point), while his own ratings gained him over 6. Then quote the magazine that said ratings carry over without ever hiding them to check. Then say what was not tested: plates rated by a machine or by the chef himself, one dish tasted at a time, single-plate orders.", "app": "The application's own version of this example would be a stored solution such as \"replay these 6 commands with this gap\" for the Write that never completed in sample S17, row 155. It must not appear in the paper, because the paper uses no project data.", "table": null, "risks": {"caption": "First-page choices and what breaks if they are skipped", "rows": [{"item": "Lead with a simple motivating example (the CHIME cell)", "what_can_go_wrong": "The reader does not see why the question matters.", "when": "At the first-stage screen, before full reviewers read the paper.", "what_it_costs": "One accepted agent-memory evaluation paper nearly failed on motivation for exactly this reason.", "how_to_notice": "A reviewer asks for \"a simple clear motivating example\".", "restaurant": "The jury is told about rating theory before it is shown the one restaurant where the old rating misled."}, {"item": "State the limits plainly on the first page", "what_can_go_wrong": "Reviewers find the limits themselves and read them as hidden.", "when": "When a reviewer notices that scores are not human, items are shown one at a time and tasks are single-call.", "what_it_costs": "Lost trust; the ICML (International Conference on Machine Learning) form says authors \"should be rewarded rather than punished for being up front about the limitations\".", "how_to_notice": "Reviews list the limits as weaknesses the authors did not mention.", "restaurant": "We admit up front that only single plates were tasted, before the jury asks about full dinners."}]}}, {"title": "Figure 1 and the main table", "plain": "Figure 1 is a grid: old model down one side, new model across the top. Each cell shows retained validity for that ordered pair, meaning how well the old scores still rank items compared with how well they ranked them with the old model. The diagonal, where a model is swapped onto itself, shows the noise floor: how much results move when nothing has changed. The main table has one row per ordered pair and one column per arm (each way of handling the memory), with intervals (error bars).", "restaurant": "Draw a chart with the old chef down the side and the new chef across the top. Each square says how well the old ratings still pick the best dish under that new chef. The squares where a chef \"replaces\" himself show how much ratings wobble by luck alone. The table then shows, for every chef change, how Keep, Wipe, Fixed discount, Calibrated and the other choices did, each with a range for luck.", "app": "Today the application could not fill even one square of this grid for itself, because it does not record which model each judgement was made with. Recording the model beside each judgement is the first step if the owner ever wants this check for the tool.", "table": null, "risks": {"caption": "Figure and table rules and what breaks if they are ignored", "rows": [{"item": "Self-swap diagonal as the noise floor", "what_can_go_wrong": "A normal day-to-day wobble is reported as a real drop.", "when": "When a swap effect is smaller than the wobble of a model swapped onto itself.", "what_it_costs": "The paper claims an effect that is only noise, and a careful reviewer catches it.", "how_to_notice": "The drop on the diagonal is about as large as the drops elsewhere in the grid.", "restaurant": "Suresh's ratings look worse than Ravi's, but Ravi's own ratings move that much from Monday to Tuesday."}, {"item": "One row per ordered pair, never only an average", "what_can_go_wrong": "An average hides two large opposite effects.", "when": "When a swap helps one way and hurts the other, as in Goyal and Ray (+9.91 one way, -13.28 the other, about -1.7 on average).", "what_it_costs": "The paper would report \"almost nothing happened\" when two big things happened.", "how_to_notice": "Per-pair numbers point in opposite directions while the pooled number sits near zero.", "restaurant": "Moving ratings from Ravi to Suresh helps, from Suresh to Ravi hurts, and the average says \"no change\"."}]}}, {"title": "Related work, and what not to claim as new", "plain": "Related work is a table of what each close paper measured and what it left out. Three things must not be claimed as new: moving scored memory across models, comparing a model's own memory with transferred memory, and the discount rule itself. The discount is a known statistical device, the power prior, in which old evidence counts with a weight between 0 and 1.", "restaurant": "Other magazines already moved ratings to a new chef, and already compared a chef's own ratings with inherited ones. Trusting old ratings \"partly\" is an old, known trick. What is new is checking whether the old ratings still pick the right dish, and which of the four day-one choices works best.", "app": "Not applicable: this is about how the paper stands against published work, not about the application.", "table": null, "risks": {"caption": "The three things not to claim as new", "rows": [{"item": "Moving scored memory across models", "what_can_go_wrong": "A reviewer points to papers that already did it.", "when": "As soon as the claim appears in the introduction.", "what_it_costs": "Originality is marked down for a claim that is false.", "how_to_notice": "Reviews name MemRL, RoMeRL or CHIME, which all moved scored memory to a new model.", "restaurant": "We announce the first restaurant to keep ratings after a chef change, but three magazines already reported one."}, {"item": "Comparing own memory with transferred memory", "what_can_go_wrong": "A reviewer points to papers that already compared them.", "when": "When the paper presents this comparison as its contribution.", "what_it_costs": "The real contribution, checking the scores, gets lost behind a false one.", "how_to_notice": "Reviews name CHIME, Goyal and Ray, MemCollab or Memory Transfer Learning.", "restaurant": "We claim to be first to compare the new chef's own ratings with inherited ones, which others already did."}, {"item": "The discount rule itself", "what_can_go_wrong": "A reviewer recognises it as the power prior.", "when": "When the calibrated discount is described as a new method.", "what_it_costs": "The paper looks unaware of standard statistics.", "how_to_notice": "A review says \"this is a power prior\".", "restaurant": "We claim to have invented \"trust old ratings partly\", an idea long in use."}]}}, {"title": "Release, and the week for the first page", "plain": "Release code, prompts, raw answers, score files and probe tables, anonymised and hosted at submission. An area chair screens each paper before reviewers see it, so the abstract, introduction and first figure get their own week. Title style itself has no measured effect on acceptance; the title checks are about accuracy.", "restaurant": "Hand the jury every tasting sheet, recipe card and plate score, with the restaurant's name blacked out so the jury judges the food, not the name. The head judge tastes first, so the first plate gets a full week of practice.", "app": "Nothing from the application goes into the release. The project's hand-over files contain column names taken from a customer's machine, and none of that may enter the paper or its release.", "table": null, "risks": {"caption": "Release choices and what breaks if they are ignored", "rows": [{"item": "Release everything at submission, anonymised", "what_can_go_wrong": "The release shows who the authors are, or is missing when reviewers look.", "when": "On the day of submission, when the anonymised repository goes up.", "what_it_costs": "An anonymity fault is one of the faults the plan says to avoid at the first stage; a missing release loses the group gain seen at ICLR (44% accepted with code or data against 33% without).", "how_to_notice": "A name, company or link in the files reveals the authors.", "restaurant": "The tasting sheets carry the restaurant's logo, so the jury knows whose dish it is."}, {"item": "Keep project and customer material out", "what_can_go_wrong": "Customer-derived column names from the hand-over files end up in the paper or release.", "when": "When files are copied from the project instead of built from public benchmarks.", "what_it_costs": "A breach of the rule that the paper uses no company or customer data.", "how_to_notice": "A search of the release for project column names finds a match.", "restaurant": "A customer's secret recipe card slips into the pile handed to the jury."}]}}]}, {"chapter": "Submission rules to meet", "summary": "This section lists eight rules the ICML 2027 submission must meet (ICML is the International Conference on Machine Learning), what each means for the team, and whether it was confirmed or not re-checked. It ends with a countdown to the two deadlines and an 11-item checklist.", "steps": [{"title": "Two deadlines, no extensions", "plain": "The abstract is due on 14 January 2027 and the paper on 22 January 2027, each at the end of the day anywhere on Earth, with no extensions. The author list is fixed at the abstract deadline. Status: confirmed.", "restaurant": "The food award takes entry forms on 14 January and the dishes on 22 January, with no late entries. The cooks named on the entry form cannot change after 14 January.", "app": "Not applicable: these are the conference's dates and do not touch the application.", "table": null, "risks": {"caption": "Deadline rules", "rows": [{"item": "Abstract 14 Jan, paper 22 Jan 2027, no extensions", "what_can_go_wrong": "The paper misses the deadline and cannot be submitted to ICML 2027 at all.", "when": "If clearance, experiments or writing slip past the dates.", "what_it_costs": "The first try moves to the next venue, NeurIPS 2027 (the Conference on Neural Information Processing Systems), months later.", "how_to_notice": "The countdown reaches zero with checklist items still open.", "restaurant": "The dish is ready on 23 January, one day after the award stopped taking dishes."}, {"item": "Author list fixed at the abstract deadline", "what_can_go_wrong": "A real contributor, or the experienced author, is left off.", "when": "When the author list is still being argued about on 14 January.", "what_it_costs": "Team make-up is the largest measured gap in acceptance, and it cannot be fixed later.", "how_to_notice": "Someone asks to be added after 14 January.", "restaurant": "The award-winning cook joins the team a week after the entry form closed."}]}}, {"title": "Choose exactly one contribution type", "plain": "The paper must pick one contribution type. \"Datasets, Evaluations and Benchmarks\" covers auditing and needs no new algorithm, but it does not lower the bar. Status: confirmed.", "restaurant": "The award has categories, and each entry goes in exactly one. The \"restaurant review\" category does not need a new recipe, but its jury is just as strict as the \"new dish\" jury.", "app": "Not applicable: this is a choice about the paper only.", "table": null, "risks": {"caption": "Contribution type rule", "rows": [{"item": "Exactly one contribution type", "what_can_go_wrong": "The type does not fit the result, or the team assumes the evaluation type is easier.", "when": "When the type is picked before the results are in.", "what_it_costs": "Reviewers judge the paper against the wrong expectations; the bar is not lower in any type.", "how_to_notice": "Reviews ask for a new algorithm, or call the evaluation thin.", "restaurant": "We enter a tasting report in the \"new dish\" category, where the jury wants a new recipe."}]}}, {"title": "Document licences, sources, contamination and limits", "plain": "This contribution type asks authors to cover licensing, provenance (where each piece of data came from), contamination (whether the test data may already have been seen by the models) and limits, where relevant. Data step 8 records the licences: StreamBench's code is Apache-2.0, MemRL and RoMeRL are MIT, and the StreamBench data on Hugging Face and LifelongAgentBench declare no licence. Status: confirmed.", "restaurant": "Say where every ingredient came from and whether you were allowed to use it. Admit if the tasters may have eaten the dish before. Some suppliers gave no terms at all, so do not hand out their ingredients; point to the supplier instead.", "app": "The project's hand-over files contain column names taken from a customer's machine; none of that may enter the paper or its release.", "table": {"caption": "Licences recorded in data step 8", "columns": ["Source", "Licence"], "rows": [["StreamBench code", "Apache-2.0"], ["MemRL code", "MIT"], ["RoMeRL code", "MIT"], ["StreamBench data on Hugging Face", "No licence declared"], ["LifelongAgentBench", "No licence declared"]]}, "risks": {"caption": "Documentation rule", "rows": [{"item": "Document licensing, provenance, contamination and limits", "what_can_go_wrong": "Data with no declared licence is re-released as if it were free to share.", "when": "When the release package is built before the terms for DDXPlus and BIRD are confirmed.", "what_it_costs": "A reviewer or a data owner raises a licence problem with the release.", "how_to_notice": "The release contains benchmark files instead of pointers to the original sources.", "restaurant": "We hand out a supplier's spice mix that came with no permission to share it."}]}}, {"title": "One paper limit and reciprocal reviewing", "plain": "A team with no eligible reviewer may submit only one paper. The limit goes if one author has an accepted paper at a listed venue, such as ICML, NeurIPS, ICLR (International Conference on Learning Representations) or TMLR (Transactions on Machine Learning Research, a journal). The designated author must register and review between 24 February and 16 March 2027. ICML 2026 desk-rejected (rejected without review) 497 papers for reviewer violations. Status: confirmed.", "restaurant": "Each team entering the award lends one experienced cook to the jury for about three weeks. A team with no past winner may enter only one dish. If the lent cook does not do the judging, the team's entry is thrown out; last year 497 entries were.", "app": "Not applicable: this is a rule about the authors, not about the application.", "table": null, "risks": {"caption": "Reviewer rules", "rows": [{"item": "One paper only for a team with no eligible reviewer", "what_can_go_wrong": "The team has no author with an accepted paper at a listed venue.", "when": "When the author list is built only from people without such a paper.", "what_it_costs": "Only one submission is allowed, and the plan's lower odds apply (about 11 to 15% instead of about 27% at ICML on the first try).", "how_to_notice": "Nobody on the author list can name an accepted paper at a listed venue.", "restaurant": "Our kitchen has no past award winner, so it may enter only one dish and is judged more harshly."}, {"item": "Reciprocal reviewing, 24 February to 16 March 2027", "what_can_go_wrong": "The designated author does not register or does not review in time.", "when": "During the review window, if that author's time is not protected.", "what_it_costs": "The paper can be desk-rejected; ICML 2026 desk-rejected 497 papers for reviewer violations.", "how_to_notice": "Review requests sit unanswered as 16 March approaches.", "restaurant": "Our cook skips jury duty, and the award throws out our dish without tasting it."}]}}, {"title": "Two-stage review", "plain": "Papers are reviewed in two stages. A first-stage rejection carries a short justification, not full reviews. First-stage rejection notices come on 23 February 2027 and final decisions on 3 May 2027. Status: confirmed.", "restaurant": "A head judge tastes every entry first and sends some home with one line of reason. Only the rest reach the full jury.", "app": "Not applicable: this is how the conference reviews papers.", "table": null, "risks": {"caption": "Review rule", "rows": [{"item": "Two-stage review", "what_can_go_wrong": "The paper is rejected at the first stage with only a short reason.", "when": "If the abstract, introduction and first figure do not make the case at once.", "what_it_costs": "Little feedback to improve the paper for the next venue.", "how_to_notice": "A first-stage notice arrives on 23 February 2027.", "restaurant": "The head judge sends our dish home after one bite, with one line on a card."}]}}, {"title": "Rules not re-checked yet", "plain": "Two rows were not re-checked. The first: 8 pages, an AI (artificial intelligence) disclosure statement, an impact statement, anonymity, preprints allowed and attendance optional; these come from an earlier reading of the official call, so read the author instructions again when the style file is posted. The second: TMLR's criteria are claims supported by evidence and of interest to some readers, and novelty is not required.", "restaurant": "The plate size and labelling rules were copied from last year's rule sheet; read the new sheet when it comes out. The food guide (TMLR) only asks that what you claim is true and interests some readers; it does not ask for a new dish.", "app": "Not applicable: these are the venues' rules.", "table": null, "risks": {"caption": "Rules marked \"Not re-checked\"", "rows": [{"item": "8 pages, AI disclosure, impact statement, anonymity, preprint allowed, attendance optional", "what_can_go_wrong": "One of these rules changed for 2027 and the paper breaks it.", "when": "If the author instructions are not read again when the style file is posted.", "what_it_costs": "A format, anonymity or disclosure fault at the first stage.", "how_to_notice": "The new style file or call differs from the earlier reading.", "restaurant": "This year the award wants smaller plates, and we bring last year's size."}, {"item": "TMLR criteria", "what_can_go_wrong": "The journal's criteria differ from the earlier reading.", "when": "When the paper reaches the TMLR step of the ladder.", "what_it_costs": "The last fallback venue is planned on a wrong assumption.", "how_to_notice": "TMLR's own page says something different.", "restaurant": "The food guide changed what it asks of a review since we last read its rules."}]}}, {"title": "Countdown and checklist", "plain": "The page counts down to the two deadlines and gives an 11-item checklist to tick before submitting.", "restaurant": "Before the dish goes to the jury, tick off eleven things: cooks registered, team fixed, category chosen, plate size right, logo hidden, notes on helpers and impact written, ingredient sources listed, tasting sheets ready, every quoted source checked, and a cook lent to the jury.", "app": "Not applicable: this checklist is for the paper.", "table": {"caption": "Submission checklist (11 items)", "columns": ["#", "Item"], "rows": [["1", "Every author has a complete, correct OpenReview profile (OpenReview is the website where papers are submitted and reviewed)"], ["2", "Author list fixed; it closes with the abstract on 14 January"], ["3", "One contribution type chosen"], ["4", "Paper fits the page limit in the official ICML style file (8 pages in the earlier reading; check the style file when it is posted)"], ["5", "Anonymised: no names, company or links that reveal the authors"], ["6", "AI disclosure statement written"], ["7", "Impact statement written"], ["8", "Licences, data sources and limits documented"], ["9", "Code, prompts and raw answers anonymised and hosted"], ["10", "Every reference checked by hand"], ["11", "Reviewing author designated and registered, if the team has one"]]}, "risks": null}]}, {"chapter": "Verified and open", "summary": "Two verification passes checked 50 claims against primary sources, each by three independent verifiers; all 50 were confirmed and none refuted, but they covered only part of the plan. The section marks each part of the plan as verified, unread, not run, unverified, an estimate or a judgement, and lists what only the owner or the employer can settle.", "steps": [{"title": "What was checked, and how", "plain": "Two verification passes checked 50 claims against primary sources (the original papers, pages and files). Each claim was checked by three independent verifiers. All 50 were confirmed and none was refuted. The checks covered only part of the plan, so the table below says which parts.", "restaurant": "Three separate inspectors each checked 50 statements in our write-up against the original sources, and all 50 held. But they did not inspect the whole kitchen, so the list says which corners were inspected and which were not.", "app": "The same honesty applies to the application: today it does Keep and does not record which model a judgement was made with. That is a known open point, not a checked one.", "table": {"caption": "What was checked and what is still open", "columns": ["Part of the plan", "Status", "Note"], "rows": [["Gap is open in eight close papers read in full", "Verified", "MemRL, RoMeRL, CHIME, Goyal and Ray, MemCollab, Memory Transfer Learning, EvoKernel, arXiv 2611.03930"], ["Four close papers", "Unread", "Xia et al. and three ICLR 2027 submissions. The skill-library submission is the closest by title. ICLR decisions come on 16 December"], ["Data and code locations, counts, formats", "Verified", "As in \"Prepare the data\""], ["Data preparation sequence as a whole", "Not run", "Each step is verified; nobody has run them end to end"], ["Model names, prices, limits, retirement dates", "Unverified", "From earlier notes. Confirm on vendor pages on day one"], ["Size of memory gains on the two benchmarks with current models", "Unverified", "The pilot measures it"], ["Cost of about USD 700", "Estimate", "Built on assumed token counts; add embedding cost for the MemRL and RoMeRL legs"], ["Statistical references (power prior, equivalence test, error bars)", "Not re-checked", "Open each paper before citing it"], ["Acceptance odds", "Judgement", "Group rates adjusted by stated assumptions; not a forecast for this paper"]]}, "risks": null}, {"title": "Verified: the gap and the data", "plain": "Two parts are verified. The gap is open in the eight close papers read in full: none checks whether old scores still rank items correctly after a model change, or compares keep, wipe and discount. The data and code locations, counts and formats in \"Prepare the data\" were checked against the repositories and dataset files on 15 November 2026.", "restaurant": "Eight magazine articles were read cover to cover, and none hid the ratings to check whether they still picked the right dish under a new chef. The addresses of the suppliers and the size of each delivery were checked too.", "app": "Not applicable: these checks are about published papers and public data.", "table": null, "risks": {"caption": "Verified parts and what could still go wrong", "rows": [{"item": "Gap is open in eight close papers read in full", "what_can_go_wrong": "A newer paper closes the gap before this one is out.", "when": "While several groups are close, and before the paper is submitted or posted.", "what_it_costs": "The claim must narrow, or the paper loses its main point.", "how_to_notice": "A new preprint or a decision on a related paper compares keep, wipe and discount.", "restaurant": "Another magazine publishes the hidden-ratings test a month before ours."}, {"item": "Data and code locations, counts, formats", "what_can_go_wrong": "A repository or dataset changes after 15 November 2026.", "when": "When files are fetched later than the commits named in the plan.", "what_it_costs": "Small fixes and re-runs.", "how_to_notice": "A count check fails, such as the 1,764 DDXPlus and 1,534 BIRD test tasks.", "restaurant": "The supplier changes the size of the sack after we wrote down the weight."}]}}, {"title": "Unread and not run", "plain": "Four close papers are unread: Xia et al. and three ICLR 2027 submissions (ICLR is the International Conference on Learning Representations). The skill-library submission is the closest by title, and ICLR decisions come on 16 December. The data preparation sequence has not been run end to end, though each step was verified.", "restaurant": "Four more magazine articles are still unread, and one has a title very close to ours. Each step of the recipe was checked, but nobody has cooked the whole dish start to finish yet.", "app": "Not applicable: these are open items of the paper.", "table": null, "risks": {"caption": "Unread and not-run parts", "rows": [{"item": "Four close papers unread", "what_can_go_wrong": "One of them already compares keep, wipe and discount for numeric scores.", "when": "When they are read in a normal browser, or when ICLR decisions come on 16 December.", "what_it_costs": "The paper's claim must narrow.", "how_to_notice": "Reading \"When Can a Skill Library Trust Its Execution Records?\" and the others shows the same comparison.", "restaurant": "The unread magazine with the similar title turns out to have hidden the ratings already."}, {"item": "Data preparation sequence not run end to end", "what_can_go_wrong": "Steps that each work alone fail together.", "when": "In the first week, while data steps 1 to 5 and the pilot run.", "what_it_costs": "Days lost from a tight schedule; a slip of more than three days cuts the MemRL leg down to the RoMeRL score files.", "how_to_notice": "A step needs a fix the plan did not list.", "restaurant": "Each part of the recipe works, but the whole meal is not ready on time."}]}}, {"title": "Unverified, estimates and judgements", "plain": "Model names, prices, limits and retirement dates come from earlier notes and must be confirmed on vendor pages on day one. The size of memory gains with current models is unverified; the pilot measures it. The cost of about USD 700 (US dollars) is an estimate built on assumed token counts, plus embedding cost for the MemRL and RoMeRL legs. The statistical references are not re-checked, and the acceptance odds are a judgement, not a forecast.", "restaurant": "The chefs' names and leaving dates came from old notes; check them at the agency. Nobody knows yet how much the ratings help with today's chefs; the trial week will show. The grocery bill is a guess from assumed portions. The chance of winning the award is an informed guess, not a promise.", "app": "The same caution applies to the application: nothing has run on real data yet, and the closing of the project's own gaps waits on a real drive and a real capture.", "table": null, "risks": {"caption": "Unverified, estimated and judged parts", "rows": [{"item": "Model names, prices, limits, retirement dates", "what_can_go_wrong": "A model named in the plan is renamed, priced differently or retired sooner.", "when": "On day one, when API (programming interface) accounts are opened.", "what_it_costs": "A pair of models may have to change, and budget or timing moves.", "how_to_notice": "The vendor's own page disagrees with the plan.", "restaurant": "The chef we planned to test leaves the agency before the trial."}, {"item": "Size of memory gains with current models", "what_can_go_wrong": "Memory barely helps on a benchmark, so there is nothing to carry over.", "when": "In the pilot, by 22 November.", "what_it_costs": "If the gate fails twice, the January attempt with this idea is over.", "how_to_notice": "The pilot gain is below 5 points.", "restaurant": "With today's chefs, the ratings barely change which dish is best."}, {"item": "Cost of about USD 700", "what_can_go_wrong": "Real token counts are higher than assumed.", "when": "When the pilot measures real cost, on about day 5.", "what_it_costs": "The budget needs its headroom, up to USD 1,400.", "how_to_notice": "Measured cost per 1,000 calls is ng": "Clearance takes weeks, or customer material is found in a public place.", "when": "In the first week, if clearance is not asked for at once.", "what_it_costs": "No preprint or submission is possible without clearance.", "how_to_notice": "No written clearance as the January deadlines come close.", "restaurant": "The owner has not said yes, so the dish cannot leave the kitchen."}, {"item": "The author list and any prior paper at a listed venue", "what_can_go_wrong": "No author is eligible to review.", "when": "When the list closes on 14 January 2027.", "what_it_costs": "The one-paper limit and lower odds apply.", "how_to_notice": "Nobody on the list has an accepted paper at a listed venue.", "restaurant": "No cook on the team has won before."}, {"item": "Working hours, model keys and travel", "what_can_go_wrong": "The work has no time or keys to run.", "when": "From the first paid run onwards.", "what_it_costs": "The schedule slips past the freeze on 15 December.", "how_to_notice": "Experiments stop for lack of keys or hours.", "restaurant": "The kitchen has no budget for the trial plates."}]}}]}, {"chapter": "What to tell your manager in one minute", "summary": "This chapter is the minute-long pitch in three steps: the question, what it gives the organisation, and the odds with the decisions needed. Every fact comes from the original's \"Pitch to your manager\", \"Expected outcomes\" and \"Raise the chances\" sections.", "steps": [{"title": "1. The question, and the small ask", "plain": "Our tool never trains a model; what it learns is kept as scores beside a language model we rent, and vendors retire those models on short notice. The model under the tool has already changed more than once. Published work shows scored memory still helps after a swap, but nobody has tested whether the scores themselves are still right. Ask for one week to run a pilot on public data with about USD 700 (US dollars) of model calls; on 22 November show five numbers and decide togeth const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let ch = 0, st = 0, pick = "keep";
const RULES = { keep: ["Keep", 0.90, "Trust the old score fully.", "The biryani keeps showing 9 of 10, whoever cooks."],
  wipe: ["Wipe", 0.50, "Reset the score to the starting value 0.50: unknown.", "All ratings are removed; the biryani starts as 'not rated yet'."],
  fixed: ["Fixed discount", 0.70, "Trust the old score halfway, the same at every change: 0.50 + 0.50 x (0.90 - 0.50) = 0.70.", "The menu shows Ravi's rating as 'half believable' for every new chef."],
  cal: ["Calibrated", 0.54, "Run 16 fresh cases with the new model first. Here they agree poorly, so trust = 0.10: 0.50 + 0.10 x (0.90 - 0.50) = 0.54.", "Suresh cooks 16 plates first; customers rate them lower than Ravi's, so the old 9 of 10 counts for little."] };
function tryIt() {
  const r = RULES[pick];
  return `<div class="try"><b>Try it.</b> Tip A (the biryani) earned 0.90 with the old model (Chef Ravi). Pick a rule (the numbers are made up, as in the plan):
  <div class="choices">${Object.keys(RULES).map(k => `<button type="button" class="btn" data-rule="${k}" aria-pressed="${k === pick}">${RULES[k][0]}</button>`).join("")}</div>
  <div>Tip A starts with <span class="big">${r[1].toFixed(2)}</span></div><div>${esc(r[2])}</div><div class="hint" style="color:var(--food)">${esc(r[3])}</div></div>`;
}
function table(t) {
  if (!t || !t.rows || !t.rows.length) return "";
  return `<div class="tw"><table>${t.caption ? `<caption>${esc(t.caption)}</caption>` : ""}<thead><tr>${(t.columns || []).map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
  <tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function risks(t) {
  if (!t || !t.rows || !t.rows.length) return "";
  return `<div class="tw risk"><table>${t.caption ? `<caption>${esc(t.caption)}</caption>` : ""}<thead><tr><th>Choice or result</th><th>What can go wrong</th><th>When it happens</th><th>What it costs you</th><th>How you would notice</th><th>In the restaurant</th></tr></thead>
  <tbody>${t.rows.map(r => `<tr><td class="item">${esc(r.item)}</td><td>${esc(r.what_can_go_wrong)}</td><td>${esc(r.when)}</td><td>${esc(r.what_it_costs)}</td><td>${esc(r.how_to_notice)}</td><td class="food">${esc(r.restaurant)}</td></tr>`).join("")}</tbody></table></div>`;
}
function draw() {
  document.getElementById("nav").innerHTML = DATA.map((c, i) => `<button type="button" data-ch="${i}" ${i === ch ? 'aria-current="true"' : ""}><span class="n">${i + 1}</span><span>${esc(c.chapter)}<br><span class="k">${c.steps.length} steps</span></span></button>`).join("");
  const c = DATA[ch], s = c.steps[st];
  const body = `<div class="kicker">Chapter ${ch + 1} of ${DATA.length} · ${esc(c.chapter)} · step ${st + 1} of ${c.steps.length}</div>
    ${st === 0 ? `<p class="hint" style="max-width:80ch">${esc(c.summary)}</p>` : ""}
    <h2>${esc(s.title)}</h2>
    <div class="box plain"><h4>In plain words</h4>${esc(s.plain)}</div>
    <div class="box food"><h4>The restaurant</h4>${esc(s.restaurant)}</div>
    <div class="box app"><h4>In your application</h4>${esc(s.app)}</div>
    ${ch === 0 && st === 0 ? tryIt() : ""}${table(s.table)}${risks(s.risks)}`;
  const first = ch === 0 && st === 0, last = ch === DATA.length - 1 && st === c.steps.length - 1;
  document.getElementById("main").innerHTML = `<div class="card">${body}<div class="dots">${c.steps.map((_, k) => `<button type="button" data-st="${k}" ${k === st ? 'aria-current="true"' : ""} aria-label="Step ${k + 1}">${k + 1}</button>`).join("")}</div>
    <div class="navrow"><span class="hint">Arrow keys: ← back, → next</span><div class="btns"><button type="button" class="btn" id="back" ${first ? "disabled" : ""}>Back</button>
    <button type="button" class="btn primary" id="next" ${last ? "disabled" : ""}>${st < c.steps.length - 1 ? "Next" : "Next chapter"}</button></div></div></div>`;
  try { history.replaceState(null, "", "#part-" + (ch + 1) + "-" + (st + 1)); } catch (e) {}
}
function go(d) {

  draw(); if (matchMedia("(max-width: 820px)").matches) document.getElementById("main").scrollIntoView({ block: "start" }); else window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-ch]"); if (a) { ch = +a.dataset.ch; st = 0; draw(); return; }
  const b = e.target.closest("[data-st]"); if (b) { st = +b.dataset.st; draw(); return; }
  const r = e.target.closest("[data-rule]"); if (r) { pick = r.dataset.rule; draw(); return; }
  if (e.target.id === "next") go(1); if (e.target.id === "back") go(-1);
  if (e.target.id === "theme") { const x = document.documentElement; const dark = x.dataset.theme ? x.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; x.dataset.theme = dark ? "light" : "dark"; }
});
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
